##########################################################
#                   INFERENCE SETTING                    #
##########################################################
# Common usage:
#   python run.py --stages infer \
#       --training_config conf/training.yaml \
#       --inference_config conf/inference.yaml
#
# `run.py` copies `exp_tag` / `exp_dir` from the training config.
#
# `data_dir` is not one of the fields `run.py` copies from the training
# config, so it needs the same override `conf/metrics.yaml` and
# `conf/publication.yaml` already carry -- without it this fell back to
# TEMPLATE's literal `./data` default and `infer` could not find
# `token_list`. See espnet_work/multicorpus_ser_report.md §6.2.
data_dir: ${oc.env:EMODB_OUTPUT,./data}

##########################################################
#                    DATASET DEFINITION                  #
##########################################################
# The test split keeps the unfiltered manifest; see `dataset/config.yaml`.
dataset:
  test:
    - name: valid
      data_src_args:
        split: valid
    - name: test
      data_src_args:
        split: test

##########################################################
#                    MODEL AND OUTPUT                    #
##########################################################
# `valid.acc.ave_1best.pth` is written by ESPnet3's checkpoint-averaging
# callback as `{best_model_criterion monitor}.ave_{nbest}best.pth`, so the name
# stays the same across re-training. This mirrors ESPnet2's default
# `inference_model=valid.acc.best.pth`.
model:
  _target_: espnet3.systems.cls.inference_model.ClsInferenceModel
  # Must match `model` in training.yaml (without `class_weights`).
  network:
    _target_: espnet3.systems.cls.model.ClsModel
    frontend:
      _target_: espnet3.systems.cls.frontend.Wav2Vec2Frontend
      encoder:
        _target_: transformers.AutoModel.from_pretrained
        pretrained_model_name_or_path: microsoft/wavlm-large
      normalize:
        _target_: espnet3.systems.cls.model.WaveformNormalize
        stats_file: ${stats_dir}/train/feats_stats.npz
    # `token_list` ends with `<unk>`, which is not a class.
    num_classes: 7
    head_size: 1024
    head_layers: 1
    dropout: 0.5
    # The baseline standardises the waveform with one mean and one deviation
    # taken over the training set, which is what `collect_stats` writes.
  model_file: ${exp_dir}/valid.acc.ave_1best.pth
  token_list: ${data_dir}/token_list

input_key: speech
output_fn: src.inference.build_output
