##########################################################
#                    TRAINING SETTING                    #
##########################################################
# Quick usage:
#   python run.py --stages create_dataset --training_config conf/training.yaml
#   python run.py --stages collect_stats train --training_config conf/training.yaml
#
##########################################################
#                  SYSTEM AND PATH SETTING               #
##########################################################
# Left empty on purpose. Without it ESPnet3 instantiates `model` through Hydra
# instead of routing it to an ESPnet2 task, which is what this system needs: its
# model is its own, not one of ESPnet2's registry entries.
task:

# `dataset/builder.py` writes the manifests here; the WAV files stay where the
# corpus was downloaded. Keep the two in sync by reading the same variable.
data_dir: ${oc.env:EMODB_OUTPUT,./data}
exp_tag: train_wavlmasp

##########################################################
#              LONG/SHORT FILTERING SETTING              #
##########################################################
# The test split is left unfiltered so the reported scores cover all of it.
# EmoDB clips run 1.2 to 9.0 s, so the bounds below drop nothing; they are kept
# to catch a corrupt or truncated file rather than to reshape the data.
remove_long_short:
  min_wav_duration: 0.1
  max_wav_duration: 30
  splits:
    - train
    - valid
  save_path: ${data_dir}/manifest_filtered
  manifest_paths:
    train: ${data_dir}/manifest/train.tsv
    valid: ${data_dir}/manifest/valid.tsv

##########################################################
#                  LABEL INVENTORY SETTING               #
##########################################################
# Built from the filtered training manifest, so a label that only ever appears
# in a dropped utterance does not enter the class list.
prepare_labels:
  save_path: ${data_dir}
  filename: token_list
  # Inverse class frequencies, which `model.class_weights` reads back.
  weights_filename: class_weights
  manifest_path: ${data_dir}/manifest_filtered/train.tsv
  add_symbol:
    - "<unk>:-1"

##########################################################
#                    DATASET DEFINITION                  #
##########################################################
dataset:
  train:
    - data_src_args:
        split: train
  valid:
    - data_src_args:
        split: valid
  preprocessor:
    _target_: espnet2.train.preprocessor.CommonPreprocessor
    fs: 16000
    # Classification stores the emotion label in the `label` field.
    text_name: label
    token_type: word
    token_list: ${data_dir}/token_list

##########################################################
#                      MODEL SETTING                     #
##########################################################
model:
  _target_: espnet3.systems.wavlmasp.model.WavlmAspModel
  encoder:
    _target_: transformers.AutoModel.from_pretrained
    pretrained_model_name_or_path: microsoft/wavlm-large
  # `token_list` ends with `<unk>`, which is not a class.
  num_classes: 7
  head_size: 1024
  head_layers: 1
  dropout: 0.5
  class_weights: ${data_dir}/class_weights
  # The baseline standardises the waveform with one mean and one deviation
  # taken over the training set, which is what `collect_stats` writes.
  normalize:
    _target_: espnet3.systems.wavlmasp.model.WaveformNormalize
    stats_file: ${stats_dir}/train/feats_stats.npz

##########################################################
#                  OPTIMIZATION SETTING                  #
##########################################################
optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-5


best_model_criterion:
  - - valid/acc
    - 1
    - max

seed: 0

##########################################################
#                   DATALOADER SETTING                   #
##########################################################
# `collect_feats` measures the waveform, so `fold_lengths` counts samples:
# 160000 is 10 s at 16 kHz. Every EmoDB clip is shorter, so batches stay at
# `batch_size`; the fold is kept so an unusually long file shrinks its own.
dataloader:
  train:
    iter_factory:
      batches:
        type: folded
        batch_size: 8
        fold_lengths: [160000]
        sort_in_batch: descending
        sort_batch: descending
  valid:
    iter_factory:
      batches:
        fold_lengths: [160000]
        sort_in_batch: descending
        sort_batch: descending

##########################################################
#                     TRAINER SETTING                    #
##########################################################
trainer:
  devices: 1
  num_nodes: 1
  gradient_clip_val: 5.0
  # 403 training utterances at effective batch 32 is ~13 updates/epoch;
  # 30 epochs (the original default) stopped training at ~350 total
  # updates, well short of convergence. 231 epochs targets ~3000 updates,
  # matching the other single-corpus wavlmasp recipes; see
  # espnet_work/per_corpus_baseline_plan.md §4.
  max_epochs: 231
  # The paper trains at a batch of 32. The encoder is fine-tuned in full, so
  # the batch is split and accumulated to fit.
  accumulate_grad_batches: 4

  # ESPnet2 stops on `valid/loss`, but this recipe selects checkpoints on
  # `valid/acc`; watching the same value keeps the best epoch from being cut off.
  # patience raised from 5 to 15 alongside max_epochs, so early stopping
  # doesn't fire before the larger epoch budget can be used.
  callbacks:
    - _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: valid/acc
      mode: max
      patience: 15

fit: {}
