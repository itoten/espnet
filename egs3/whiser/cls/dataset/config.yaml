builder:
  # Source layout ---------------------------------------------------------
  # `<source>/wav/<name>.wav` plus `<source>/labels_consensus.csv`.
  source_env_var: WHISER
  dataset_path: download
  audio_subdir: wav
  labels_csv: labels_consensus.csv

  # Download --------------------------------------------------------------
  # The audio is a plain directory listing (no login, no archive); the label
  # table is in the corpus GitHub repository.
  audio_url: https://www.lab-msp.com/WHiSER/Annotation_wav_files/
  labels_url: https://raw.githubusercontent.com/msplabresearch/WHiSER/main/Labels/labels_consensus.csv
  # Fewer files means an interrupted download.
  expected_files: 5427
  download_workers: 4

  # Labels ----------------------------------------------------------------
  # Same eight classes and the same `O`/`X` handling as the msppodcast recipe:
  # `O` is the annotators' free-text catch-all and `X` means no agreed label.
  emotion_codes:
    A: angry
    C: contempt
    D: disgust
    F: fear
    H: happy
    N: neutral
    S: sad
    U: surprise
  drop_codes:
    - O
    - X

  # Duplicates ------------------------------------------------------------
  # 53 clusters of recordings with the same sound (decoded-identical or a
  # waveform correlation above 0.9), mostly the same tape under names that
  # differ in one letter (`rmn_e655a` / `rmn_e655b`).
  #
  # The 3 clusters whose files carry different labels cannot be judged, so all
  # of their 6 files are always left out.
  exclude_files:
    - rmn_e018a_112.1-2_714.wav
    - rmn_e018a_44.1-2_17.wav
    - rmn_e655a_3.1-2_535.wav
    - rmn_e655a_3.1-2_636.wav
    - rmn_e655b_3.1-2_540.wav
    - rmn_e655b_3.1-2_649.wav

  # In each of the other 50 clusters (one label) the first file by name is kept.
  # `exclude_duplicates: true` leaves out the other 51 files; `false` uses them.
  exclude_duplicates: true
  duplicate_files:
    - rmn_e004a_17.1-2_18.wav
    - rmn_e007b_165.1-2_275.wav
    - rmn_e007c_159.1-2_14.wav
    - rmn_e018a_112.1-2_552.wav
    - rmn_e018a_44.1-2_48.wav
    - rmn_e308b_13.1-2_175.wav
    - rmn_e308b_13.1-2_991.wav
