builder:
  # Source layout ---------------------------------------------------------
  # `<source>/wav/<name>.wav` plus `<source>/labels_consensus.csv`.
  source_env_var: WHISER
  dataset_path: download
  audio_subdir: wav
  labels_csv: labels_consensus.csv

  # Download --------------------------------------------------------------
  # The audio is a plain directory listing (no login, no archive); the label
  # table is in the corpus GitHub repository.
  audio_url: https://www.lab-msp.com/WHiSER/Annotation_wav_files/
  labels_url: https://raw.githubusercontent.com/msplabresearch/WHiSER/main/Labels/labels_consensus.csv
  # Fewer files means an interrupted download.
  expected_files: 5427
  download_workers: 4

  # Labels ----------------------------------------------------------------
  # Same eight classes and the same `O`/`X` handling as the msppodcast recipe:
  # `O` is the annotators' free-text catch-all and `X` means no agreed label.
  emotion_codes:
    A: angry
    C: contempt
    D: disgust
    F: fear
    H: happy
    N: neutral
    S: sad
    U: surprise
  drop_codes:
    - O
    - X

  # Split -----------------------------------------------------------------
  # No partition or speaker id is published (`Split_Set` is `NA` and `SpkrID`
  # is `Unknown` for every file). Utterances sharing the file-name prefix
  # before the first `.` (e.g. `001-105` in `001-105.1-2_14.wav`) are kept in
  # one split, as a guess at "same source recording" that has not been checked
  # against the corpus metadata.
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  output_env_var: WHISER_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
