builder:
  # Corpora merged into one training set -----------------------------------
  # Each entry's `data_src` points at that corpus's own `esp2_cls` recipe, so
  # this recipe reuses its download/conversion logic unchanged; only the
  # manifests are recombined here. See `multicorpus_ser_plan.md` §3 for why
  # the merge happens at this layer instead of in `dataset.train`.
  train_corpora:
    - name: cremad
      data_src: cremad/esp2_cls
    - name: emns
      data_src: emns/esp2_cls
    - name: emodb
      data_src: emodb/esp2_cls
    - name: emozionalmente
      data_src: emozionalmente/esp2_cls
    - name: enterface05
      data_src: enterface05/esp2_cls
    - name: jlcorpus
      data_src: jlcorpus/esp2_cls
    - name: meld
      data_src: meld/esp2_cls
    - name: quechua
      data_src: quechua/esp2_cls
    - name: subesco
      data_src: subesco/esp2_cls
    - name: thorsten
      data_src: thorsten/esp2_cls

  # Corpora scored but never trained on. MSP-Podcast contributes two test
  # splits (Test1 and Test2), so both are listed explicitly.
  eval_only_corpora:
    - name: msppodcast
      data_src: msppodcast/esp2_cls
      splits: [test, test2]

  # full20: every label a corpus carries survives as its own class, except
  # `contempt` (MSP-Podcast only, and the training corpora never produce it,
  # so it would be a zero-shot class). The `core7` sibling recipe instead
  # drops everything outside the IS2025 baseline's 7 classes; the two are
  # compared against each other on purpose. See `label_inventory.md` and
  # `multicorpus_ser_plan.md` §1.1 for the class list and counts.
  #
  # The `anger`/`joy`/`sadness`/`surprised`/`disgusted` entries are spelling
  # fixes (MELD, Emozionalmente, Quechua, Thorsten each use one), not a
  # category merge; every other entry is an identity mapping that exists so
  # the label is explicitly acknowledged rather than silently kept by
  # default.
  label_map:
    angry: angry
    anger: angry
    happy: happy
    joy: happy
    sad: sad
    sadness: sad
    surprise: surprise
    surprised: surprise
    fear: fear
    disgust: disgust
    disgusted: disgust
    neutral: neutral
    excited: excited
    sleepy: sleepy
    boredom: boredom
    calm: calm
    amused: amused
    drunk: drunk
    whisper: whisper
    anxious: anxious
    apologetic: apologetic
    assertive: assertive
    concerned: concerned
    encouraging: encouraging
    sarcastic: sarcastic
    # `contempt` intentionally absent: it is dropped, same as core7.

  # Where the corpus-specific `_espnet3` build lives. Point at a directory
  # holding this recipe's merged manifests, or let it default under the
  # recipe. The wav files themselves stay wherever each corpus's own
  # `<CORPUS>_OUTPUT` points; only the merged manifests live here.
  output_env_var: MULTICORPUS_FULL20_OUTPUT
  data_path: data

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv

dataset:
  # Train and valid read the `remove_long_short` output; every test split
  # stays unfiltered so reported scores cover each test set in full.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
