builder:
  # Source layout ---------------------------------------------------------
  # `data/mp3/<contributor>-<category>-<instance>.mp3`, e.g. `000001-01-1.mp3`
  # (contributor 000001-000357, category 01-30, instance 1-3). Files are found
  # recursively below the source directory.
  source_env_var: EMOGATOR
  dataset_path: download

  # Download --------------------------------------------------------------
  # GitHub repository fredbuhl/EmoGator (Apache-2.0), pinned commit. The
  # tarball is about 490 MB; only the mp3 files are kept.
  archive_url: https://codeload.github.com/fredbuhl/EmoGator/tar.gz/51eeca515a95f168ab73391cd9e7c975ab964429
  archive_name: EmoGator.tar.gz
  # Fewer files means an interrupted extraction.
  expected_files: 32130
  remove_archive: true

  # Labels ----------------------------------------------------------------
  # The category number in the file name to manifest label. The names are the
  # 30 categories of the repository README, in its order.
  emotion_map:
    "01": adoration
    "02": amusement
    "03": angry
    "04": awe
    "05": confusion
    "06": contempt
    "07": contentment
    "08": desire
    "09": disappointment
    "10": disgust
    "11": distress
    "12": ecstasy
    "13": elation
    "14": embarrassment
    "15": fear
    "16": guilt
    "17": interest
    "18": neutral
    "19": pain
    "20": pride
    "21": realization
    "22": relief
    "23": romantic_love
    "24": sad
    "25": serenity
    "26": shame
    "27": surprise_negative
    "28": surprise_positive
    "29": sympathy
    "30": triumph

  # Duplicates ------------------------------------------------------------
  # Recordings with the same sound (identical after decoding, or a waveform
  # correlation of 0.998 or more) and the same label as another one
  # (20 utterances; the first of each group by id is kept). With
  # `exclude_duplicates: true` these are left out; `false` uses every recording.
  exclude_duplicates: false
  duplicate_ids:
    - emogator-000104-27-2
    - emogator-000142-02-3
    - emogator-000156-21-2
    - emogator-000160-11-2
    - emogator-000160-15-2
    - emogator-000160-19-3
    - emogator-000160-23-3
    - emogator-000183-09-3
    - emogator-000202-03-2
    - emogator-000202-07-2
    - emogator-000212-07-3
    - emogator-000234-24-3
    - emogator-000240-23-2
    - emogator-000242-10-2
    - emogator-000242-13-3
    - emogator-000242-14-3
    - emogator-000247-06-2
    - emogator-000294-02-3
    - emogator-000295-12-2
    - emogator-000317-25-2

  # Split -----------------------------------------------------------------
  # No partition is published. Whole contributors are held out (357 in total,
  # each with all 30 categories three times): 71 for test (20%), 36 for valid
  # (10%), the rest for training.
  n_test_speakers: 71
  n_valid_speakers: 36
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # The mp3 files are 44.1 or 48 kHz, mono or stereo; `build()` converts them
  # to 16 kHz mono wav.
  output_env_var: EMOGATOR_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000
  convert_workers: 8

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
