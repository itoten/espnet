builder:
  # Source layout ---------------------------------------------------------
  # Parquet files of the Hugging Face dataset, `<Language>/<split>-NNNNN-of-NNNNN.parquet`
  # (about 450 utterances each, audio embedded as 48 kHz mono wav). They are
  # fetched one language at a time, converted, and deleted.
  source_env_var: RASA
  dataset_path: download

  # Download --------------------------------------------------------------
  # Hugging Face dataset `ai4bharat/Rasa` (CC BY 4.0). The dataset is gated:
  # the Hugging Face account must first agree on the dataset page to share its
  # username and email with the authors. About 388 GB in total.
  hf_repo: ai4bharat/Rasa
  download_workers: 12
  languages:
    - Assamese
    - Bengali
    - Bodo
    - Dogri
    - Gujarati
    - Hindi
    - Kannada
    - Kashmiri
    - Konkani
    - Maithili
    - Malayalam
    - Manipuri
    - Marathi
    - Nepali
    - Odia
    - Punjabi
    - Sanskrit
    - Santali
    - Sindhi
    - Tamil
    - Telugu
    - Urdu

  # Labels ----------------------------------------------------------------
  # The `style` column is the label: the text source or speaking style the
  # artist recorded (neutral text sources, commands, conversation, news,
  # book reading, and the six Ekman emotions). Lower case, spaces to `_`.

  # Split -----------------------------------------------------------------
  # The published train/test partition; valid is a random 10% of train,
  # stratified by language, speaker gender and style.
  valid_ratio: 0.1
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Duplicates ------------------------------------------------------------
  # 2,529 pairs of byte-identical recordings, each from one speaker with one
  # style (1,644 pairs have consecutive filenames; 464 pairs span the published
  # train and test). `duplicate_ids` names the copy to leave out of each pair:
  # the train one when the pair spans train and test, else the higher id. With
  # `exclude_duplicates: true` these are left out; `false` uses every utterance.
  exclude_duplicates: false
  duplicate_ids:
    - rasa-ASM_F_WIKI_00169
    - rasa-DOI_F_ALEXA_00129
