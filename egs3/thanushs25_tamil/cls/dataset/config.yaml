builder:
  # Source layout ---------------------------------------------------------
  # `final_data/<emotion>/audio_<N>.wav`, one directory per emotion.
  source_env_var: THANUSHS25_TAMIL
  dataset_path: download
  audio_subdir: final_data

  # Download --------------------------------------------------------------
  # Hugging Face dataset repo (pinned commit), no login. The card states no
  # licence and no source of the recordings. Each file is checked against the
  # SHA-256 listed by the Hub.
  repo_id: Thanushs25/tamil-audio-emotion-classification
  revision: 2a01784b7a9d8d7fbd36a7d2480214d9a26e5312
  # Fewer files means an interrupted download.
  # Byte-identical recordings with one label are kept once when true; false keeps
  # every copy (the count check is then skipped). Label-conflicting copies are always dropped.
  exclude_duplicates: true
  expected_files: 195
  download_workers: 4

  # Labels ----------------------------------------------------------------
  # The folder name to manifest label.
  emotion_map:
    angry: angry
    fear: fear
    happy: happy
    neutral: neutral
    sad: sad

  # Split -----------------------------------------------------------------
  # No partition and no speaker id are published. Utterances are split at
  # random within each label; speakers are not held out. Byte-identical
  # recordings are kept once so that a copy cannot sit in two splits.
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # The recordings are 44.1 or 48 kHz stereo; `build()` converts them to 16 kHz mono.
  output_env_var: THANUSHS25_TAMIL_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
