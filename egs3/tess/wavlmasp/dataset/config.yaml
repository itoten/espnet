builder:
  # Source layout ---------------------------------------------------------
  # One flat directory of `<speaker>_<word>_<emotion>.wav`, e.g.
  # `OAF_back_angry.wav`.
  source_env_var: TESS
  dataset_path: download

  # Download --------------------------------------------------------------
  # Borealis Dataverse, doi:10.5683/SP2/E8H2MF, CC BY-NC 4.0. The dataset has no
  # archive file; this endpoint zips all 2800 files on the server.
  base_url: https://borealisdata.ca/api/access/dataset/:persistentId/
  persistent_id: "doi:10.5683/SP2/E8H2MF"
  archive_name: tess.zip
  remove_archive: true

  # Labels ----------------------------------------------------------------
  # File-name emotion to manifest label; `ps` is "pleasant surprise".
  emotion_map:
    angry: angry
    disgust: disgust
    fear: fear
    happy: happy
    sad: sad
    neutral: neutral
    ps: surprise

  # Split -----------------------------------------------------------------
  # No partition is published. Utterances are split at random within each
  # label, so every split shares both speakers and all 200 words.
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # The recordings are 24.4 kHz (one is 96 kHz), so `build()` resamples all.
  output_env_var: TESS_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
