builder:
  # Source layout ---------------------------------------------------------
  # `ASVP_UPDATE/{Audio,Bonus}/actor_NN/` folders of
  # `<modality>-<channel>-<emotion>-<intensity>-<statement>-<actor>-<age>-
  # <source>-<language>[-...].wav`. Only the speech recordings (vocal channel
  # 01) are used; the rest are non-speech vocalizations such as laughs and cries.
  source_env_var: ASVPESD
  dataset_path: download

  # Download --------------------------------------------------------------
  # Zenodo record 4782712, CC BY 4.0; `md5` is the checksum Zenodo lists.
  archive_url: https://zenodo.org/api/records/4782712/files/ASVP_ESD.zip/content
  archive_name: ASVP_ESD.zip
  md5: 3bde7b3c050b512f908b4a154e1015d0
  speech_channel: "01"
  # Fewer speech recordings means an interrupted extraction.
  expected_files: 3555
  remove_archive: true

  # Labels ----------------------------------------------------------------
  # The file name's emotion code to manifest label. The codes 01 boredom,
  # 09 excited, 10 pleasure, 11 pain and 12 disappointment have no counterpart
  # among the seven shared labels and are left out.
  emotion_map:
    "02": neutral
    "03": happy
    "04": sad
    "05": angry
    "06": fear
    "07": disgust
    "08": surprise

  # Duplicates ------------------------------------------------------------
  # Recordings with the same sound (identical after decoding, or a waveform
  # correlation of 0.998 or more) and the same label as another one
  # (14 utterances; the first of each group by id is kept). With
  # `exclude_duplicates: true` these are left out; `false` uses every recording.
  exclude_duplicates: true
  duplicate_ids:
    - asvpesd-a14-03-01-03-01-14-14-02-03-01
    - asvpesd-a15-03-01-03-01-18-15-01-03-01
    - asvpesd-a15-03-01-03-01-24-15-01-03-01
    - asvpesd-a15-03-01-03-01-28-15-01-03-01
    - asvpesd-a19-03-01-02-01-17-19-02-03-01
    - asvpesd-a19-03-01-04-01-17-19-02-03-01
    - asvpesd-a20-03-01-05-02-11-20-01-03-01
    - asvpesd-a31-03-01-03-01-04-31-02-03-01
    - asvpesd-a31-03-01-03-01-14-31-02-03-01
    - asvpesd-a31-03-01-05-01-14-31-02-03-01
    - asvpesd-a32-03-01-05-01-12-32-03-03-01-01
    - asvpesd-a38-03-01-02-02-11-38-02-03-01
    - asvpesd-a54-03-01-05-01-03-54-02-02-02-15-01
    - asvpesd-a9-03-01-03-01-31-09-02-03-01-77

  # Recordings with the same sound but different labels (8 pairs, 16
  # utterances) are ambiguous; none of them is used.
  conflicting_ids:
    - asvpesd-a10-03-01-02-01-02-10-02-03-01
    - asvpesd-a10-03-01-08-01-06-10-02-03-01
    - asvpesd-a3-03-01-02-01-37-03-02-03-01
    - asvpesd-a3-03-01-08-01-27-03-02-03-01
    - asvpesd-a35-03-01-02-01-06-35-03-03-01
    - asvpesd-a35-03-01-04-01-06-35-03-03-01
    - asvpesd-a35-03-01-02-02-01-35-03-03-01-01
    - asvpesd-a35-03-01-04-02-01-35-03-03-01-01
    - asvpesd-a35-03-01-04-02-01-35-03-03-01
    - asvpesd-a35-03-01-06-02-01-35-03-03-01
    - asvpesd-a35-03-01-04-02-02-35-03-03-01-02
    - asvpesd-a35-03-01-06-02-02-35-03-03-01-02
    - asvpesd-a35-03-01-04-02-12-35-03-03-01
    - asvpesd-a35-03-01-05-02-12-35-03-03-01
    - asvpesd-a35-03-01-05-01-08-35-03-03-01
    - asvpesd-a35-03-01-07-01-08-35-03-03-01

  # The 25 speech recordings under `Bonus/` (folders actor_50 and actor_150) are
  # infant and child voices, mostly babbling and repeated words. They are used by
  # default; `exclude_bonus: true` leaves them out.
  exclude_bonus: false
  bonus_dir: Bonus

  # Split -----------------------------------------------------------------
  # No partition is published. Utterances are split at random within each
  # label; speakers are not held out, so the splits share all speakers.
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # The recordings are already 16 kHz mono; `build()` converts them anyway.
  output_env_var: ASVPESD_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
