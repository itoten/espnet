builder:
  # Source layout ---------------------------------------------------------
  # `<speaker>_<emotion>/<speaker>_<emotion>_<sentence>.wav`, e.g.
  # `fujitou_angry/fujitou_angry_033.wav`: 3 speakers x 3 emotions x the same
  # 100 sentences.
  source_env_var: VOICESTATS
  dataset_path: download

  # Download --------------------------------------------------------------
  # One tar.gz per speaker and emotion from the authors' GitHub Pages
  # repository voice-statistics/voice-statistics.github.com, pinned to its
  # latest commit. The site offers the audio free of charge for mainly personal
  # research and analysis and forbids redistribution; no checksums are published.
  base_url: https://github.com/voice-statistics/voice-statistics.github.com/raw/22923912010c358a4a044702e78b343f3ba8123f/assets/data
  archives:
    - fujitou_angry
    - fujitou_happy
    - fujitou_normal
    - tsuchiya_angry
    - tsuchiya_happy
    - tsuchiya_normal
    - uemura_angry
    - uemura_happy
    - uemura_normal
  # Fewer files means an interrupted extraction.
  expected_files: 900
  remove_archive: true

  # Labels ----------------------------------------------------------------
  # The file name's emotion word to manifest label. `normal` is the site's
  # 通常 (ordinary) reading, mapped to neutral.
  emotion_map:
    angry: angry
    happy: happy
    normal: neutral

  # Split -----------------------------------------------------------------
  # No partition is published. Utterances are split at random within each
  # label; speakers are not held out.
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # `build()` converts the recordings to 16 kHz mono.
  output_env_var: VOICESTATS_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
