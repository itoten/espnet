builder:
  # Source layout ---------------------------------------------------------
  # `<source>/data/{audio/{agent,caller},transcript,metadata}/<sid>.*`, the
  # layout of the GitHub repository. Each call has one 8 kHz mono wav per side.
  source_env_var: HARPER_VALLEY_BANK
  dataset_path: download
  audio_subdir: data/audio
  transcript_subdir: data/transcript

  # Download --------------------------------------------------------------
  # The repository tarball of the default branch (no login). It holds the
  # audio, so no separate file list is needed.
  archive_url: https://codeload.github.com/cricketclub/gridspace-stanford-harper-valley/tar.gz/refs/heads/master
  archive_name: harper_valley_bank.tar.gz
  # Fewer calls means an interrupted extraction.
  expected_calls: 1446
  remove_archive: true

  # Labels ----------------------------------------------------------------
  # Each segment carries a softmax over these three classes produced by a
  # Gridspace model (not a human label); the label is the arg-max.
  polarity_classes:
    - negative
    - neutral
    - positive

  # Split -----------------------------------------------------------------
  # No partition is published. Whole calls are assigned at random, so no call
  # spans two splits. Speakers are not held out (the same speakers appear in
  # several calls).
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # Segments are cut from the 8 kHz call recordings and written as 16 kHz mono.
  output_env_var: HARPER_VALLEY_BANK_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000
  convert_workers: 8

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
