##########################################################
#                   INFERENCE SETTING                    #
##########################################################
# Common usage:
#   python run.py --stages infer measure \
#       --training_config conf/training.yaml \
#       --inference_config conf/inference.yaml \
#       --metrics_config conf/metrics.yaml
#
# Mirrors `conf/training.yaml`'s `dataset.test`: MSP-Podcast's own Test1/
# Test2 plus the 5 out-of-domain corpora (the latter served by this recipe's
# own `dataset/dataset.py`; see that module for why those entries have no
# `data_src:`).
data_dir: ${oc.env:MSPPODCAST_OUTPUT,./data}

dataset:
  test:
    - name: msppodcast_test
      data_src_args: {split: test}
    - name: msppodcast_test2
      data_src_args: {split: test2}
    - name: emovdb
      data_src_args: {split: emovdb}
    - name: iemocap
      data_src_args: {split: iemocap}
    - name: tess
      data_src_args: {split: tess}
    - name: savee
      data_src_args: {split: savee}
    - name: ravdess
      data_src_args: {split: ravdess}

model:
  _target_: espnet3.systems.cls.inference_model.ClsInferenceModel
  # Must match `model` in training.yaml (without `class_weights`).
  network:
    _target_: espnet3.systems.cls.model.ClsModel
    frontend:
      _target_: espnet3.systems.cls.frontend.Wav2Vec2Frontend
      encoder:
        _target_: transformers.AutoModel.from_pretrained
        pretrained_model_name_or_path: microsoft/wavlm-large
      normalize:
        _target_: espnet3.systems.cls.model.WaveformNormalize
        stats_file: ${stats_dir}/train/feats_stats.npz
    # angry/disgust/fear/happy/neutral/sad/surprise/contempt. `token_list` ends
    # with `<unk>`, which is not a class.
    num_classes: 8
    head_size: 1024
    head_layers: 1
    dropout: 0.5
  model_file: ${exp_dir}/valid.acc.ave_1best.pth
  token_list: ${data_dir}/token_list

input_key: speech
output_fn: src.inference.build_output
