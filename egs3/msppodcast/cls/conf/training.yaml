##########################################################
#                    TRAINING SETTING                    #
##########################################################
# Run the three steps as separate commands: under multi-GPU DDP, Lightning
# re-runs the whole command once per GPU, so data preparation or inference
# chained onto `train` would run several times at once.
#   python run.py --stages create_dataset remove_long_short prepare_labels \
#       collect_stats --training_config conf/training.yaml
#   python run.py --stages train --training_config conf/training.yaml
#   python run.py --stages infer measure --training_config conf/training.yaml \
#       --inference_config conf/inference.yaml --metrics_config conf/metrics.yaml
#
##########################################################
#                  SYSTEM AND PATH SETTING               #
##########################################################
task:

# Manifests, token_list, class_weights and the converted WAV files.
data_dir: ${oc.env:MSPPODCAST_OUTPUT,./data}
exp_tag: train_cls_msppodcast

##########################################################
#              LONG/SHORT FILTERING SETTING              #
##########################################################
# Same bound as the other emotion recipes: 0.5s clears the 11 conv-output
# frames WavLM's SpecAugment mask needs (`mask_time_length: 10`).
remove_long_short:
  min_wav_duration: 0.5
  max_wav_duration: 30
  splits:
    - train
    - valid
  save_path: ${data_dir}/manifest_filtered
  manifest_paths:
    train: ${data_dir}/manifest/train.tsv
    valid: ${data_dir}/manifest/valid.tsv

##########################################################
#                  LABEL INVENTORY SETTING               #
##########################################################
# `dataset/config.yaml`'s `emotion_codes` keeps 8 classes (the 7 the other
# emotion recipes share, plus contempt); this should always come out to 8.
prepare_labels:
  save_path: ${data_dir}
  filename: token_list
  weights_filename: class_weights
  manifest_path: ${data_dir}/manifest_filtered/train.tsv
  add_symbol:
    - "<unk>:-1"

##########################################################
#                    DATASET DEFINITION                  #
##########################################################
# `test` has two groups: MSP-Podcast's own Test1/Test2 (this recipe's own
# manifests) and the 5 out-of-domain corpora, served by this recipe's own
# `dataset/dataset.py` by reading `multicorpus_ood20`'s already-built
# manifests directly (see that module for why `data_src:` is not used here:
# it would route through `create_dataset`'s generic builder loop, which
# resolves every `data_src` against *this* recipe's own `recipe_dir`).
dataset:
  train:
    - data_src_args:
        split: train
  valid:
    - data_src_args:
        split: valid
  test:
    - name: msppodcast_test
      data_src_args: {split: test}
    - name: msppodcast_test2
      data_src_args: {split: test2}
    - name: emovdb
      data_src_args: {split: emovdb}
    - name: iemocap
      data_src_args: {split: iemocap}
    - name: tess
      data_src_args: {split: tess}
    - name: savee
      data_src_args: {split: savee}
    - name: ravdess
      data_src_args: {split: ravdess}
  preprocessor:
    _target_: espnet2.train.preprocessor.CommonPreprocessor
    fs: 16000
    text_name: label
    token_type: word
    token_list: ${data_dir}/token_list

##########################################################
#                      MODEL SETTING                     #
##########################################################
model:
  _target_: espnet3.systems.cls.model.ClsModel
  frontend:
    _target_: espnet3.systems.cls.frontend.Wav2Vec2Frontend
    encoder:
      _target_: transformers.AutoModel.from_pretrained
      pretrained_model_name_or_path: microsoft/wavlm-large
    normalize:
      _target_: espnet3.systems.cls.model.WaveformNormalize
      stats_file: ${stats_dir}/train/feats_stats.npz
  # angry/disgust/fear/happy/neutral/sad/surprise/contempt. `token_list` ends
  # with `<unk>`, which is not a class.
  num_classes: 8
  head_size: 1024
  head_layers: 1
  dropout: 0.5
  class_weights: ${data_dir}/class_weights

##########################################################
#                  OPTIMIZATION SETTING                  #
##########################################################
optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-5

best_model_criterion:
  - - valid/acc
    - 1
    - max

seed: 0

##########################################################
#                   DATALOADER SETTING                   #
##########################################################
dataloader:
  train:
    iter_factory:
      batches:
        type: folded
        batch_size: 8
        fold_lengths: [160000]
        sort_in_batch: descending
        sort_batch: descending
  valid:
    iter_factory:
      batches:
        fold_lengths: [160000]
        sort_in_batch: descending
        sort_batch: descending

##########################################################
#                     TRAINER SETTING                    #
##########################################################
# Real validation and early stopping (unlike `multicorpus_ood20`): MSP-Podcast
# is far larger than the other corpora here, so a held-out slice of it
# (Development) is a reasonable proxy for its own held-out data. `max_epochs`
# is a ceiling; `EarlyStopping` is expected to end training well before it,
# matching the earlier MSP-Podcast model, which stopped at epoch 12 (best at
# epoch 7).
trainer:
  devices: ${num_device}
  num_nodes: ${num_nodes}
  gradient_clip_val: 5.0
  max_epochs: 300
  # Effective batch is `batch_size` x devices (24 on 3 GPUs).
  accumulate_grad_batches: 1

  callbacks:
    - _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: valid/acc
      mode: max
      patience: 5

# Set `RESUME_CKPT=<exp_dir>/last.ckpt` to continue an interrupted run.
fit:
  ckpt_path: ${oc.env:RESUME_CKPT,null}
