builder:
  # Source layout ---------------------------------------------------------
  # `berst-data/<train|validation|test>/{metadata.csv,audio/<recording>/final/<chunk>.wav}`.
  # The clips are the speech segments cut from the actors' raw recordings.
  source_env_var: BERST
  dataset_path: download
  metadata_name: metadata.csv
  split_dirs:
    train: berst-data/train
    valid: berst-data/validation
    test: berst-data/test

  # Download --------------------------------------------------------------
  # Hugging Face dataset Rosie-Lab/BERSt (CC BY 4.0, no login), pinned
  # commit. The 4,523 clips are 1.27 GB; each is fetched on its own.
  base_url: https://huggingface.co/datasets/Rosie-Lab/BERSt/resolve/fed35c477427cff44206464b7f85e68d1fc99062
  download_workers: 8
  download_retries: 5

  # Labels ----------------------------------------------------------------
  # The `affect` column (the emotion the actor was asked to portray) to
  # manifest label.
  emotion_map:
    anger: angry
    disgust: disgust
    fear: fear
    joy: happy
    neutral: neutral
    sadness: sad
    surprise: surprise

  # Clips left out (utterance ids). The metadata of 5 byte-identical pairs
  # disagrees, 6 clips hold the phrase three times in one file, 5 more hold
  # it repeated or begin with the spoken label, and 42 are copies of a clip
  # that is kept (the first by id).
  exclude_files:
    - berst-shout_data_44ec8f04-e3c7-43a7-bcd8-631d7e27c86b-chunk20
    - berst-shout_data_44ec8f04-e3c7-43a7-bcd8-631d7e27c86b-chunk31
