builder:
  # Source layout ---------------------------------------------------------
  # The Hugging Face release is two parquet shards. Each row holds
  # `file_id` (`<speaker>_<emotion>_<sentence>`), `emotion`, `speaker_id` and
  # the recording itself as WAV bytes in `audio.bytes`.
  source_env_var: NEMO
  dataset_path: download

  # Download --------------------------------------------------------------
  # Hugging Face dataset amu-cai/nEMO, CC BY-NC-SA 4.0, not gated. Pinned to
  # one revision so a later upload cannot change the data silently.
  repo_url: https://huggingface.co/datasets/amu-cai/nEMO/resolve
  revision: 140015d56f6adaad7e453dc471ba7c2856c02c8e
  shard_paths:
    - data/train-00000-of-00002.parquet
    - data/train-00001-of-00002.parquet

  # Labels ----------------------------------------------------------------
  # The `emotion` column to manifest label.
  emotion_map:
    anger: angry
    fear: fear
    happiness: happy
    neutral: neutral
    sadness: sad
    surprised: surprise

  # Split -----------------------------------------------------------------
  # The release is a single `train` split. Utterances are split at random
  # within each label; speakers are not held out, so every split shares all
  # nine speakers.
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # The recordings are 24 kHz mono, so `build()` resamples them to 16 kHz.
  output_env_var: NEMO_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
