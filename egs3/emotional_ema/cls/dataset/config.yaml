builder:
  # Source layout ---------------------------------------------------------
  # `EMA_5EMO_NSF/<jn|jr|kf>/wav_mat/ema_5emo_<speaker>_<emo>_<rate>_<set>_utt<N>.wav`
  # plus `pssg_short/wav_mat/` for the passages, and one `<group>_best_emo` table
  # (`<utterance> <code>` per line) in each of `jn/`, `jr/`, `kf/`, `pssg_short/`.
  # The label is the final label of the listener evaluation, not the prompted
  # emotion.
  source_env_var: EMOTIONAL_EMA
  dataset_path: download

  # Download --------------------------------------------------------------
  # Zenodo record 19303746, CC BY 4.0 (548 MB zip; the wav files are a small
  # part of it, the rest is articulatory data). Only the wav files are kept.
  base_url: https://zenodo.org/api/records/19303746/files
  archive_name: EMA_5EMO_NSF.zip
  archive_md5: 92dd86193f6e8b63207767f533471bff
  # Fewer files means an interrupted extraction.
  expected_files: 953
  # The label tables are extracted next to the recordings.
  label_table_suffix: _best_emo
  expected_label_tables: 4
  remove_archive: true

  # Labels ----------------------------------------------------------------
  # The code in `*_best_emo` to manifest label. The archive does not explain the
  # codes; they follow the column order (neu, ang, hap, sad, fea) of the
  # per-listener evaluation file.
  label_map:
    "1": neutral
    "2": angry
    "3": happy
    "4": sad
    "5": fear

  # Split -----------------------------------------------------------------
  # No partition is published. Utterances are split at random within each
  # label; speakers are not held out, so every split shares all 3 speakers.
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # The recordings are 22.05 kHz mono; `build()` converts them to 16 kHz.
  output_env_var: EMOTIONAL_EMA_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
