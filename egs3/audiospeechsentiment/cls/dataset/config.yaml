builder:
  # Source layout ---------------------------------------------------------
  # `TRAIN.csv` (Filename, Class) plus `TRAIN/<n>.wav` for the 250 labelled
  # recordings. `TEST/` (110 recordings) has no labels and is not used.
  source_env_var: AUDIOSPEECHSENTIMENT
  dataset_path: download

  # Source ----------------------------------------------------------------
  # Manual download from Kaggle (free account). No download is attempted here.
  kaggle_url: https://www.kaggle.com/datasets/imsparsh/audio-speech-sentiment
  label_csv: TRAIN.csv
  audio_dir: TRAIN
  # Fewer files means an incomplete extraction.
  expected_files: 250

  # Labels ----------------------------------------------------------------
  # The polarity classes of `TRAIN.csv` as published, not emotion categories.
  label_map:
    Negative: negative
    Neutral: neutral
    Positive: positive

  # Split -----------------------------------------------------------------
  # No partition or speaker id is published, so the split is a random one
  # within each label; speakers cannot be held out.
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # The recordings are 44.1 kHz stereo; `build()` converts them to 16 kHz mono.
  output_env_var: AUDIOSPEECHSENTIMENT_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
