# Up-sample the small corpora of the training set: each epoch draws its
# utterances corpus by corpus with probability proportional to the corpus's
# share of the training audio to the power of β = 0.5 (1 keeps the corpus
# shares as they are, 0 makes them all equal; ESPnet2's CategoryPowerSampler),
# then groups them into length-sorted batches as the default `numel` batches
# (`catpow_numel`). Needs `${data_dir}/corpus2utt`: one line per corpus,
# its name and then the line numbers (from 0) of its utterances in
# `manifest_filtered/train.tsv`, which are the keys of the shape files.
# Each corpus's share is met in audio duration, so an epoch holds the same
# 443 hours as the training set (`dataset_scaling_factor: 1.0`).
dataloader:
  train:
    iter_factory:
      batches:
        type: catpow_numel
        upsampling_factor: 0.5
        dataset_scaling_factor: 1.0
        category2utt_file: ${data_dir}/corpus2utt
        min_batch_size: 1
  # The template's validation batches take the training type: keep `numel`.
  valid:
    iter_factory:
      batches:
        type: numel
# The drawn epoch is a little longer than with `numel` (about 1305 batches
# instead of 1,265: the length buckets leave a little more padding).
lr_schedule:
  max_steps: 26100
