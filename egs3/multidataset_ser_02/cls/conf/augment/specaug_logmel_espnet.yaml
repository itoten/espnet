# SpecAugment for the log-mel frontends with the settings most ESPnet2
# Conformer ASR recipes use (`egs2/*/asr1/conf/**/train_asr_conformer*.yaml`):
# time warping (window 5, bicubic), two frequency masks of up to 30 of the 80
# mel bins and two time masks of up to 40 frames (0.4 s), in training only.
# Use it with a normalisation of fixed statistics
# (`conf/training_conformer_abs_gmvn.yaml`), as those recipes do.
frontend:
  specaug:
    _target_: espnet2.asr.specaug.specaug.SpecAug
    apply_time_warp: true
    time_warp_window: 5
    time_warp_mode: bicubic
    apply_freq_mask: true
    freq_mask_width_range: [0, 30]
    num_freq_mask: 2
    apply_time_mask: true
    time_mask_width_range: [0, 40]
    num_time_mask: 2
