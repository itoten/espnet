# The Conformer of `conformer.yaml` with absolute (sinusoidal) positions and
# plain self-attention instead of relative positions. Plain attention on
# SDPA runs on the flash kernel when a batch has no padding
# (`LogMelEncoderFrontend` then drops the mask), so the attention scores
# never fill memory; relative-position attention adds a position term to
# the scores and cannot. Same blocks, width and size otherwise.
_target_: espnet3.systems.cls.src.frontend.LogMelEncoderFrontend
fs: 16000
n_fft: 512
win_length: 400
hop_length: 160
n_mels: 80
d_model: 1024
conv_strides: [1, 2]
specaug: null
encoder:
  _target_: espnet2.asr.encoder.conformer_encoder.ConformerEncoder
  _partial_: true
  output_size: 1024
  attention_heads: 16
  linear_units: 4096
  num_blocks: 12
  dropout_rate: 0.1
  positional_dropout_rate: 0.1
  attention_dropout_rate: 0.1
  input_layer: null
  normalize_before: true
  macaron_style: true
  rel_pos_type: latest
  pos_enc_layer_type: abs_pos
  selfattention_layer_type: selfattn
  activation_type: swish
  use_cnn_module: true
  cnn_module_kernel: 31
  use_flash_attn: false
  use_sdpa: true
