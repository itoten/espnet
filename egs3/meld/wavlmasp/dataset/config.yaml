builder:
  # meld is the only training corpus here: an in-domain baseline for how
  # meld's own emotions are learned alone, to compare against
  # `multicorpus_full20`'s meld test score (same native labels, same
  # test set, only the training data -- solo vs. 10-corpus merge -- differs).
  train_corpora:
    - name: meld
      data_src: meld/esp2_cls

  # Every native label meld carries, kept as its own class (identity
  # mapping; a few are spelling fixes so the class names match
  # `multicorpus_full20`'s). See espnet_work/label_inventory.md for the
  # source counts.
  label_map:
    neutral: neutral
    happy: happy
    surprise: surprise
    angry: angry
    sad: sad
    disgust: disgust
    fear: fear
    joy: happy
    anger: angry
    sadness: sad

  output_env_var: MELD_WAVLMASP_OUTPUT
  data_path: data

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv

dataset:
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
