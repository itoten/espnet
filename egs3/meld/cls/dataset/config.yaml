    - Joey-dia50-utt5-sea6-epi21-train
    - Joey-dia71-utt5-sea7-epi19-test
    - Joey-dia71-utt6-sea7-epi19-test
    - Julie-dia605-utt5-sea1-epi24-train
    - Julie-dia605-utt6-sea1-epi24-train
    - Megan-dia657-utt7-sea7-epi17-train
    - Megan-dia657-utt8-sea7-epi17-train
    - Monica-dia184-utt1-sea8-epi14-test
    - Monica-dia25-utt2-sea3-epi21-test
    - Monica-dia34-utt13-sea6-epi15-test
    - Nurse-dia72-utt0-sea8-epi23-test
    - Phoebe-dia100-utt10-sea6-epi5-test
    - Phoebe-dia100-utt11-sea6-epi5-test
    - Phoebe-dia100-utt5-sea6-epi5-test
    - Phoebe-dia100-utt6-sea6-epi5-test
