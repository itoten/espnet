dataset:
  # Train and valid read the `remove_long_short` output; test stays unfiltered
  # for ESPnet2 parity. Move this selection to `conf/training.yaml` if a recipe
  # ever needs to switch between filtered and unfiltered inputs.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
