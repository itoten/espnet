builder:
  # Source layout ---------------------------------------------------------
  # MELD is distributed as MP4 clips plus per-split CSV annotations.
  # `prepare_source()` downloads and unpacks the corpus when it is missing.
  # Point `MELD` at the directory to hold it, or let the recipe use
  # `<recipe_dir>/download`.
  source_env_var: MELD
  dataset_path: download
  metadata_subdir: data
  audio_subdir: wavs

  # Download --------------------------------------------------------------
  # The archive is about 11 GB. The second URL is a mirror used when the
  # original site is unreachable.
  archive_name: MELD.Raw.tar.gz
  data_urls:
    - https://web.eecs.umich.edu/~mihalcea/downloads/
    - https://huggingface.co/datasets/declare-lab/MELD/resolve/main/
  remove_archive: true

  # Build outputs ---------------------------------------------------------
  # `build()` converts every clip to 16 kHz mono WAV, so the output tree is
  # a few GB. Set `MELD_OUTPUT` to keep those files outside the recipe.
  output_env_var: MELD_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

  splits:
    train:
      csv_name: train_sent_emo.csv
      audio_subdir: train
    valid:
      csv_name: valid_sent_emo.csv
      audio_subdir: valid
    test:
      csv_name: test_sent_emo.csv
      audio_subdir: test

  # The CSV's `Emotion` value to manifest label, spelled as in the other corpora.
  label_map:
    anger: angry
    disgust: disgust
    fear: fear
    joy: happy
    neutral: neutral
    sadness: sad
    surprise: surprise

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Four utterances that cannot be used. Two have no usable audio (the mp4 of
  # train Ross-dia125-utt3 is corrupt, the mp4 of valid Phoebe-dia110-utt7 is
  # missing). The other two, in test, have a CSV time span of about 305 s and
  # 235 s, so the clip is minutes long for a single label. Unlike the duration
  # filter, this list also applies to the test split, which is kept unfiltered
  # so that scores stay comparable with the ESPnet2 recipe.
  excluded_utterance_ids:
    - Ross-dia125-utt3-sea4-epi18-train
    - Phoebe-dia110-utt7-sea6-epi11-valid
    - Student-dia38-utt4-sea3-epi7-test
    - Phoebe-dia220-utt0-sea2-epi1-test

  # Duplicates ------------------------------------------------------------
  # Recordings with the same sound. In MELD, 19 recordings are same-label copies of another and 53 recordings sit in same-sound groups with different labels.
  # With `exclude_duplicates: true` the same-label copies in `duplicate_ids`
  # (the first of each group by id is kept) are left out; with
  # `exclude_conflicting: true` the recordings in `conflicting_ids` (same sound,
  # different labels) are left out. `false` uses every recording.
  exclude_duplicates: false
  exclude_conflicting: false
  duplicate_ids:
    - Chandler-dia85-utt1-sea6-epi4-test
    - Joey-dia662-utt0-sea2-epi2-train
    - Joey-dia725-utt0-sea7-epi22-train
    - Joey-dia725-utt2-sea7-epi22-train
    - Joey-dia85-utt0-sea6-epi4-test
    - Joey-dia93-utt9-sea6-epi21-test
    - Kristen-dia851-utt17-sea7-epi17-train
    - Monica-dia47-utt8-sea6-epi2-test
    - Monica-dia875-utt10-sea5-epi5-train
    - Monica-dia926-utt9-sea6-epi2-train
    - Phoebe-dia100-utt17-sea6-epi5-test
    - Phoebe-dia41-utt9-sea4-epi14-test
    - Phoebe-dia45-utt5-sea7-epi1-test
    - Phoebe-dia491-utt0-sea1-epi3-train
    - Phoebe-dia725-utt1-sea7-epi22-train
    - Rachel-dia698-utt1-sea3-epi25-train
    - Rachel-dia72-utt7-sea8-epi23-test
    - Ross-dia698-utt0-sea3-epi25-train
    - Ross-dia84-utt1-sea5-epi13-valid
  conflicting_ids:
    - Chandler-dia49-utt8-sea5-epi5-test
    - Chandler-dia49-utt9-sea5-epi5-test
    - Joey-dia14-utt1-sea6-epi4-test
