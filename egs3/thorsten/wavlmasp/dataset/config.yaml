builder:
  # thorsten is the only training corpus here: an in-domain baseline for how
  # thorsten's own emotions are learned alone, to compare against
  # `multicorpus_full20`'s thorsten test score (same native labels, same
  # test set, only the training data -- solo vs. 10-corpus merge -- differs).
  train_corpora:
    - name: thorsten
      data_src: thorsten/esp2_cls

  # Every native label thorsten carries, kept as its own class (identity
  # mapping; a few are spelling fixes so the class names match
  # `multicorpus_full20`'s). See espnet_work/label_inventory.md for the
  # source counts.
  label_map:
    amused: amused
    angry: angry
    disgust: disgust
    drunk: drunk
    neutral: neutral
    sleepy: sleepy
    surprise: surprise
    whisper: whisper
    disgusted: disgust
    surprised: surprise

  output_env_var: THORSTEN_WAVLMASP_OUTPUT
  data_path: data

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv

dataset:
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
