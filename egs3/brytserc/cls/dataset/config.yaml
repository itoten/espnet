builder:
  # Source layout ---------------------------------------------------------
  # `<Emotion>_<n>_<Gender>.wav`, all in one directory: 745 clips per emotion,
  # each exactly 3 s at 44.1 kHz mono, cut from YouTube videos.
  source_env_var: BRYTSERC
  dataset_path: download

  # Download --------------------------------------------------------------
  # figshare article 30218872 (version 3, 1.1 GB). The audio is third-party
  # YouTube content; the record limits its use to non-commercial research.
  archive_url: https://ndownloader.figshare.com/files/58302829
  archive_name: BRYTSERC.zip
  archive_md5: 988af91f7397d65c8d0753b880a9e0d6
  # Fewer files means an interrupted extraction.
  expected_files: 5215
  remove_archive: true

  # Labels ----------------------------------------------------------------
  # The emotion in the file name to manifest label.
  emotion_map:
    Angry: angry
    Disgust: disgust
    Fear: fear
    Happy: happy
    Neutral: neutral
    Sad: sad
    Surprise: surprise

  # Split -----------------------------------------------------------------
  # No partition is published. Utterances are split at random within each
  # label; no speaker or source-video id is published.
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # The recordings are 44.1 kHz mono; `build()` converts them to 16 kHz.
  output_env_var: BRYTSERC_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
