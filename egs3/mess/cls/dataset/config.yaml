builder:
  # Source layout ---------------------------------------------------------
  # Flat directory of `<emotion><gender><speaker><frame><item>_SCR.wav`.
  source_env_var: MESS
  dataset_path: download

  # Download --------------------------------------------------------------
  # Zenodo record 3813437, CC BY 4.0. The archive holds the 1800 WAV files.
  base_url: https://zenodo.org/api/records/3813437/files
  archive_name: MESS compressed.zip
  # 6 speakers x 4 emotions x 75 sentences; fewer files means an interrupted
  # extraction.
  expected_files: 1800
  remove_archive: true

  # Labels ----------------------------------------------------------------
  # The file name's one-letter emotion code to manifest label.
  emotion_map:
    A: angry
    C: calm
    H: happy
    S: sad

  # Split -----------------------------------------------------------------
  # No partition is published. Utterances are split at random within each
  # label; speakers are not held out, so every split shares all 6 speakers.
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # The recordings are 24.4 kHz mono; `build()` resamples them to 16 kHz.
  output_env_var: MESS_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
