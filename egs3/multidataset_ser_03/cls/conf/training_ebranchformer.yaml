# E-Branchformer trained from scratch on log-mel features
# (`conf/frontend/ebranchformer.yaml`, about 312M parameters), for reference
# next to the Conformer. Everything else, the half batches with gradient
# accumulation included, is the same as in `conf/training_conformer.yaml`.
defaults:
  - training
  # The lr schedule: `conf/lr_schedule/<name>.yaml`, chosen by
  # MULTIDATASET_SER_03_LR_SCHEDULE (`tristage` by default).
  - lr_schedule/${oc.env:MULTIDATASET_SER_03_LR_SCHEDULE,tristage}
  - frontend: ebranchformer
  # Data augmentation: `conf/augment/<name>.yaml`, chosen by
  # MULTIDATASET_SER_03_AUGMENT (none by default).
  - augment/${oc.env:MULTIDATASET_SER_03_AUGMENT,none}
  # Training sampler: `conf/sampler/<name>.yaml`, chosen by
  # MULTIDATASET_SER_03_SAMPLER (`numel`, the length-sorted batches of
  # `conf/training.yaml`, by default).
  - sampler/${oc.env:MULTIDATASET_SER_03_SAMPLER,numel}
  - _self_

# Set MULTIDATASET_SER_03_EXP_TAG to write a run to another directory under
# `exp/` (give the same value to `infer` and `measure`, which read it here).
exp_tag: ${oc.env:MULTIDATASET_SER_03_EXP_TAG,train_ebranchformer}

frontend:
  compile_layers: true
  max_train_crop: 0.05

# Peak lr: as for the Conformer, not searched again. Set MULTIDATASET_SER_03_LR to try another value.
optimizer:
  lr: ${oc.decode:${oc.env:MULTIDATASET_SER_03_LR,5.0e-5}}
  betas: [0.9, 0.98]

# The longest batches of 21 minutes of audio do not fit in the 141 GB of an
# H200 with this encoder (it ran out of memory in the first epoch). Each
# update instead accumulates the gradients of two batches of half the size:
# the same 21 minutes of audio and the same number of updates (so
# `lr_schedule.max_steps` is unchanged) as for the other encoders.
dataloader:
  train:
    iter_factory:
      batches:
        batch_bins: 10080000
trainer:
  accumulate_grad_batches: 2
