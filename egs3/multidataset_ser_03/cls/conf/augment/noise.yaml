# Additive noise: in training, half of the utterances get a random noise
# recording from `${data_dir}/augment/noise.scp` (Kaldi-style `<id> <path>`,
# 16 kHz; `local/make_noise_list.py` writes one from FSD50K, keeping the clips
# under CC0 or CC BY and leaving out human voice, music, laughter and crying)
# at an SNR of 0 to 15 dB (the range of the MUSAN noise in ESPnet's VoxCeleb
# recipe, `egs2/voxceleb/spk1/conf/train_ECAPA_mel.yaml`; the probability
# 0.5 is also that recipe's). Validation and evaluation data are never
# augmented. Augmentation runs in the data loader workers (CPU), so they are
# raised to 15.
dataset:
  preprocessor:
    fs: 16000
    noise_scp: ${data_dir}/augment/noise.scp
    noise_apply_prob: 0.5
    noise_db_range: "0_15"
    # Many noise clips are shorter than the speech. CommonPreprocessor then
    # repeats the noise to cover the speech (its behaviour does not depend on
    # this value), and logs a warning for every clip shorter than
    # `short_noise_thres` of the speech. With noise on half the utterances
    # this filled the job logs (about 145 MB a run). 0 turns the warning off.
    short_noise_thres: 0.0
dataloader:
  train:
    iter_factory:
      num_workers: 15
