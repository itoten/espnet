builder:
  # Source layout ---------------------------------------------------------
  # `BASER_DATASET/<F|M>_<n>_<NAME>_S_<sentence>_<EMOTION>_<take>.wav`, e.g.
  # `M_4_RIAD_S_2_ANGRY_3.wav`: speaker (sex, number, name), sentence number,
  # emotion, take number (a few names lack the take or have an odd one).
  source_env_var: BASER
  dataset_path: download
  audio_subdir: BASER_DATASET

  # Download --------------------------------------------------------------
  # Kaggle needs a login, so the recipe does not download. Fetch the zip by
  # hand and extract it so that `BASER_DATASET/` lies inside `$BASER`.
  request_url: https://www.kaggle.com/datasets/jabedcse/baser-dataset
  # Fewer files means an interrupted extraction.
  expected_files: 750

  # Labels ----------------------------------------------------------------
  # The emotion in the file name to manifest label.
  emotion_map:
    ANGRY: angry
    FEAR: fear
    HAPPY: happy
    NEUTRAL: neutral
    SAD: sad

  # Duplicates ------------------------------------------------------------
  # Files left out. In each group of identical recordings (byte-identical, or
  # the same waveform for M_2_MIFTA_S_1_SAD_2/_3) only the lowest take is kept.
  # `exclude_duplicates: true` leaves these files out (the first file of each group
  # is kept); `false` uses every file.
  exclude_duplicates: true
  duplicate_files:
    - F_3_MAHI_S_1_SAD_3.wav
    - F_4_TABASSUM_S_3_NEUTRAL_3.wav
    - M_2_MIFTA_S_1_SAD_3.wav
    - M_2_MIFTA_S_2_HAPPY_3.wav
    - M_3_MAHMUD_S_2_FEAR_3.wav
    - M_4_RIAD_S_1_ANGRY_2.wav
    - M_4_RIAD_S_1_ANGRY_3.wav
    - M_4_RIAD_S_1_FEAR_2.wav
    - M_4_RIAD_S_1_FEAR_3.wav
    - M_4_RIAD_S_1_HAPPY_2.wav
    - M_4_RIAD_S_1_HAPPY_3.wav
    - M_4_RIAD_S_1_NEUTRAL_2.wav
    - M_4_RIAD_S_1_NEUTRAL_3.wav
    - M_4_RIAD_S_1_SAD_2.wav
    - M_4_RIAD_S_1_SAD_3.wav
    - M_4_RIAD_S_2_ANGRY_2.wav
    - M_4_RIAD_S_2_ANGRY_3.wav
    - M_4_RIAD_S_2_FEAR_2.wav
    - M_4_RIAD_S_2_FEAR_3.wav
    - M_4_RIAD_S_2_HAPPY_2.wav
    - M_4_RIAD_S_2_HAPPY_3.wav
    - M_4_RIAD_S_2_NEUTRAL_2.wav
    - M_4_RIAD_S_2_NEUTRAL_3.wav
    - M_4_RIAD_S_2_SAD_2.wav
    - M_4_RIAD_S_2_SAD_3.wav
    - M_4_RIAD_S_3_ANGRY_2.wav
    - M_4_RIAD_S_3_ANGRY_3.wav
    - M_4_RIAD_S_3_FEAR_2.wav
    - M_4_RIAD_S_3_FEAR_3.wav
    - M_4_RIAD_S_3_HAPPY_2.wav
    - M_4_RIAD_S_3_HAPPY_3.wav
    - M_4_RIAD_S_3_NEUTRAL_2.wav
    - M_4_RIAD_S_3_NEUTRAL_3.wav
    - M_4_RIAD_S_3_SAD_2.wav
    - M_4_RIAD_S_3_SAD_3.wav
    - M_4_RIAD_S_4_ANGRY_2.wav
    - M_4_RIAD_S_4_ANGRY_3.wav
    - M_4_RIAD_S_4_FEAR_2.wav
    - M_4_RIAD_S_4_FEAR_3.wav
    - M_4_RIAD_S_4_HAPPY_2.wav
    - M_4_RIAD_S_4_HAPPY_3.wav
    - M_4_RIAD_S_4_NEUTRAL_2.wav
    - M_4_RIAD_S_4_NEUTRAL_3.wav
    - M_4_RIAD_S_4_SAD_2.wav
    - M_4_RIAD_S_4_SAD_3.wav
    - M_4_RIAD_S_5_ANGRY_2.wav
    - M_4_RIAD_S_5_ANGRY_3.wav
    - M_4_RIAD_S_5_FEAR_2.wav
    - M_4_RIAD_S_5_FEAR_3.wav
    - M_4_RIAD_S_5_HAPPY_2.wav
    - M_4_RIAD_S_5_HAPPY_3.wav
    - M_4_RIAD_S_5_NEUTRAL_2.wav
    - M_4_RIAD_S_5_NEUTRAL_3.wav
    - M_4_RIAD_S_5_SAD_2.wav
    - M_4_RIAD_S_5_SAD_3.wav
    - M_5_JUHAYER_S_3_FEAR_2.wav
    - M_5_JUHAYER_S_3_FEAR_3.wav
    - M_5_JUHAYER_S_4_ANGRY_21.wav

  # Split -----------------------------------------------------------------
  # No partition is published. Whole speakers are held out: the test split
  # takes one female and one male speaker, the valid split one more speaker,
  # all drawn with `split_seed`; the other seven speakers train.
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # The recordings are 48 kHz mono; `build()` converts them to 16 kHz.
  output_env_var: BASER_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
