builder:
  # Source layout ---------------------------------------------------------
  # Files unpacked from the Dusha release (github.com/salute-developers/golos,
  # `dusha/`). Only the crowd domain has audio; the podcast domain is not used.
  #   crowd_train/wavs/<hash_id>.wav, crowd_test/wavs/<hash_id>.wav
  #   crowd_train/raw_crowd_train.tsv, crowd_test/raw_crowd_test.tsv
  #     (one row per annotation; the last column, source_id, groups utterances)
  #   paper_setups/crowd_large.jsonl, paper_setups/test/crowd_test.jsonl
  #     (the release's aggregated labels: train and test utterance ids)
  source_env_var: DUSHA
  dataset_path: download
  wav_dirs:
    train: crowd_train/wavs
    test: crowd_test/wavs
  markup_files:
    train: crowd_train/raw_crowd_train.tsv
    test: crowd_test/raw_crowd_test.tsv
  setup_files:
    train: paper_setups/crowd_large.jsonl
    test: paper_setups/test/crowd_test.jsonl

  # Download --------------------------------------------------------------
  # No checksum is published, so completeness is checked by byte count.
  crowd_url: https://cdn.chatwm.opensmodel.sberdevices.ru/dusha/crowd.tar
  crowd_bytes: 29968865280
  setups_url: https://cdn.chatwm.opensmodel.sberdevices.ru/dusha/paper_setups.tgz
  setups_bytes: 79022080
  remove_archive: true
  # The CDN's certificate expired on 2026-11-04. `true` accepts an expired
  # certificate but still verifies its issuer chain and host name (only the
  # validity dates are not checked); `$DUSHA_ALLOW_EXPIRED_CERTIFICATE=1` does
  # the same without editing this file. See readme.md.
  allow_expired_certificate: false

  # Labels ----------------------------------------------------------------
  # The release's emotion word to manifest label. `positive` is the release's
  # name for happiness; it is renamed to match the other recipes.
  emotion_map:
    angry: angry
    sad: sad
    neutral: neutral
    positive: happy

  # Duplicates ------------------------------------------------------------
  # Recordings with the same sound (identical after decoding, or a waveform
  # correlation of 0.998 or more) and the same label as another one (5
  # utterances; the first of each pair by id is kept). With
  # `exclude_duplicates: true` these are left out; `false` uses every recording.
  exclude_duplicates: false
  duplicate_ids:
    - dusha-bf3b68cae0f64a6c464d77cce8f59052
    - dusha-f60d3834c47b11de9aa0087c044eb72a
    - dusha-803882cf6feb732c047243873a015e77
    - dusha-691fcc12ee001779ebd79b5ef4f80011
    - dusha-f8987e287a79b38ab038c586b666e1b6

  # Four groups of the same sound carry different labels (sad against
  # neutral; 9 utterances); the label cannot be trusted, so none is used.
  conflicting_ids:
    - dusha-4634c3fe96e2ca81c49dd2cf7de6c2dd
    - dusha-91196990724712a570320dda04786cf6
    - dusha-c37668266c9a424236690e7c8244d5bd
    - dusha-31d64b1319eae0811506e7e78b142e47
    - dusha-f5169b5d64a70f617cf02c15728cb4d1
    - dusha-87df3995cbc298047c3153da70e0eab0
    - dusha-9e99f0132ad504efd098f6085e33caee
    - dusha-b707c1a9131273de1a6ccf723be99de9
    - dusha-e1b2bbfcf4a8534f2a17133506d6ed5d

  # Split -----------------------------------------------------------------
  # The release's train/test partition is kept. The validation set is taken
  # from train, in whole `source_id` groups, until `valid_ratio` of the train
  # utterances is reached.
  valid_ratio: 0.1
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # The release is 16 kHz mono 16-bit, which `build()` references in place; a
  # recording in any other format is converted into `wav_subdir`.
  # `num_workers` threads check the recordings at a time.
  output_env_var: DUSHA_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000
  num_workers: 16

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
