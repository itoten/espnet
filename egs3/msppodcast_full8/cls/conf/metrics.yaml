##########################################################
#                 METRIC SCORING SETTING                 #
##########################################################
# Common usage:
#   python run.py --stages measure \
#       --training_config conf/training.yaml \
#       --inference_config conf/inference.yaml \
#       --metrics_config conf/metrics.yaml
#
# Test sets are discovered from the subdirectories of `inference_dir`.
#
# This model predicts over 8 classes, but the evaluation corpora carry
# labels it was never trained to predict (EmoV-DB: amused, sleepy; IEMOCAP:
# excited; RAVDESS: calm). `token_list` is left unset on UA/MacroF1 so those
# extra reference labels are scored (as always-wrong) instead of raising;
# passing it would make `resolve_classes` reject any reference label outside
# the 8 classes. mAP/AUC are dropped entirely: they require `token_list` and
# raise the same way with no fallback.
data_dir: ${oc.env:MSPPODCAST_FULL8_OUTPUT,./data}

metrics:
  - metric:
      _target_: espnet3.systems.cls.metrics.wa.WA
      ref_key: ref
      hyp_key: hyp

  - metric:
      _target_: espnet3.systems.cls.metrics.ua.UA
      ref_key: ref
      hyp_key: hyp

  - metric:
      _target_: espnet3.systems.cls.metrics.macro_f1.MacroF1
      ref_key: ref
      hyp_key: hyp
