builder:
  # Corpora merged into one training set -----------------------------------
  # Each entry's `data_src` points at that corpus's own `cls` recipe, so
  # this recipe reuses its download/conversion logic unchanged; only the
  # manifests are recombined here. See `multicorpus_ser_plan.md` §3 for why
  # the merge happens at this layer instead of in `dataset.train`.
  train_corpora:
    - name: cremad
      data_src: cremad/cls
    - name: emns
      data_src: emns/cls
    - name: emodb
      data_src: emodb/cls
    - name: emozionalmente
      data_src: emozionalmente/cls
    - name: enterface05
      data_src: enterface05/cls
    - name: jlcorpus
      data_src: jlcorpus/cls
    - name: meld
      data_src: meld/cls
    - name: quechua
      data_src: quechua/cls
    - name: subesco
      data_src: subesco/cls
    - name: thorsten
      data_src: thorsten/cls

  # Corpora scored but never trained on. MSP-Podcast contributes two test
  # splits (Test1 and Test2), so both are listed explicitly.
  eval_only_corpora:
    - name: msppodcast
      data_src: msppodcast/cls
      splits: [test, test2]

  # core7: only the 7 classes shared with the IS2025 baseline survive: every
  # other label a corpus carries (`excited`, `boredom`, `calm`, `sleepy`,
  # `amused`, `drunk`, `whisper`, `sarcastic`, JL-Corpus's secondary emotions,
  # and MSP-Podcast's `contempt`) is dropped, row and all. The `full20`
  # sibling recipe keeps them instead; the two are compared against each
  # other on purpose. See `label_inventory.md` and `multicorpus_ser_plan.md`.
  #
  # The `anger`/`joy`/`sadness`/`surprised`/`disgusted` entries are spelling
  # fixes (MELD, Emozionalmente, Quechua, Thorsten each use one), not a
  # category merge.
  label_map:
    angry: angry
    anger: angry
    happy: happy
    joy: happy
    sad: sad
    sadness: sad
    surprise: surprise
    surprised: surprise
    fear: fear
    disgust: disgust
    disgusted: disgust
    neutral: neutral

  # Where the corpus-specific `_espnet3` build lives. Point at a directory
  # holding this recipe's merged manifests, or let it default under the
  # recipe. The wav files themselves stay wherever each corpus's own
  # `<CORPUS>_OUTPUT` points; only the merged manifests live here.
  output_env_var: MULTICORPUS_CORE7_OUTPUT
  data_path: data

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv

dataset:
  # Train and valid read the `remove_long_short` output; every test split
  # stays unfiltered so reported scores cover each test set in full.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
