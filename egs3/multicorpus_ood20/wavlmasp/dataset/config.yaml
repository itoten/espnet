builder:
  # Training pool ---------------------------------------------------------
  # Every split each corpus recipe defines (`train`, `valid`, `test`) is read
  # from its unfiltered `manifest/` and merged, so each corpus is used in
  # full. `data_src` names that corpus's own `wavlmasp` recipe, which
  # downloads and converts the audio.
  train_corpora:
    - name: cremad
      data_src: cremad/wavlmasp
    - name: emns
      data_src: emns/wavlmasp
    - name: emodb
      data_src: emodb/wavlmasp
    - name: emozionalmente
      data_src: emozionalmente/wavlmasp
    - name: enterface05
      data_src: enterface05/wavlmasp
    - name: jlcorpus
      data_src: jlcorpus/wavlmasp
    - name: meld
      data_src: meld/wavlmasp
    - name: quechua
      data_src: quechua/wavlmasp
    - name: subesco
      data_src: subesco/wavlmasp
    - name: thorsten
      data_src: thorsten/wavlmasp

  # Evaluation sets -------------------------------------------------------
  # None of these corpora is trained on. Each entry becomes one test set
  # keyed by `name`, built from the listed source splits merged together.
  # The first five are used in full; MSP-Podcast contributes its
  # Development set and its two test sets separately.
  eval_sets:
    - name: emovdb
      data_src: emovdb/wavlmasp
      splits: [train, valid, test]
    - name: iemocap
      data_src: iemocap/wavlmasp
      splits: [train, valid, test]
    - name: tess
      data_src: tess/wavlmasp
      splits: [train, valid, test]
    - name: savee
      data_src: savee/wavlmasp
      splits: [train, valid, test]
    - name: ravdess
      data_src: ravdess/wavlmasp
      splits: [train, valid, test]
    - name: msppodcast_dev
      data_src: msppodcast/wavlmasp
      splits: [valid]
    - name: msppodcast_test
      data_src: msppodcast/wavlmasp
      splits: [test]
    - name: msppodcast_test2
      data_src: msppodcast/wavlmasp
      splits: [test2]

  # Every label a training corpus carries is kept as its own class. The
  # `anger`/`joy`/`sadness`/`surprised`/`disgusted` entries are spelling
  # fixes, not category merges. A label absent from this map is dropped.
  label_map:
    angry: angry
    anger: angry
    happy: happy
    joy: happy
    sad: sad
    sadness: sad
    surprise: surprise
    surprised: surprise
    fear: fear
    disgust: disgust
    disgusted: disgust
    neutral: neutral
    excited: excited
    sleepy: sleepy
    boredom: boredom
    calm: calm
    amused: amused
    drunk: drunk
    whisper: whisper
    anxious: anxious
    apologetic: apologetic
    assertive: assertive
    concerned: concerned
    encouraging: encouraging
    sarcastic: sarcastic

  # The merged manifests are written here. The WAV files stay wherever each
  # corpus's own `<CORPUS>_OUTPUT` points.
  output_env_var: MULTICORPUS_OOD20_OUTPUT
  data_path: data

  # No validation runs during training (`limit_val_batches: 0`), but
  # `DataOrganizer` and `remove_long_short` still expect a `valid` split.
  # It is filled with the first `placeholder_valid_size` training rows.
  placeholder_valid_size: 64

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv

dataset:
  # Train and valid read the `remove_long_short` output; every eval set
  # stays unfiltered so it is scored in full.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
