##########################################################
#                   INFERENCE SETTING                    #
##########################################################
# Scores one saved epoch on every per-epoch eval set. The epoch is picked by
# `INFERENCE_EPOCH` (e.g. `007` for `epochs/epoch007.ckpt`); resolving this
# config fails if it is unset. Results go to `inference/epoch<NNN>/`.
#   INFERENCE_EPOCH=007 python run.py --stages infer measure \
#       --training_config conf/training.yaml \
#       --inference_config conf/inference.yaml \
#       --metrics_config conf/metrics.yaml
data_dir: ${oc.env:MULTICORPUS_OOD20_OUTPUT,./data}
inference_dir: ${exp_dir}/inference/epoch${oc.env:INFERENCE_EPOCH}

dataset:
  test:
    - {name: emovdb,          data_src_args: {split: emovdb}}
    - {name: iemocap,         data_src_args: {split: iemocap}}
    - {name: tess,            data_src_args: {split: tess}}
    - {name: savee,           data_src_args: {split: savee}}
    - {name: ravdess,         data_src_args: {split: ravdess}}
    - {name: msppodcast_dev,  data_src_args: {split: msppodcast_dev}}

model:
  _target_: src.inference.EmotionClassification
  train_config: ${exp_dir}/config.yaml
  model_file: ${exp_dir}/epochs/epoch${oc.env:INFERENCE_EPOCH}.ckpt
  token_list: ${data_dir}/token_list

input_key: speech
output_fn: src.inference.build_output
