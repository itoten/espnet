# w2v-BERT 2.0: self-supervised, 143+ languages (4.5M h), on log-mel
# filterbanks from its own feature extractor. Masking is off by default in
# this checkpoint and is switched on with the shared values.
_target_: espnet3.systems.cls.frontend.W2vBertFrontend
encoder:
  _target_: transformers.AutoModel.from_pretrained
  pretrained_model_name_or_path: facebook/w2v-bert-2.0
  layerdrop: 0.1
  apply_spec_augment: true
  mask_time_prob: 0.075
feature_extractor:
  _target_: transformers.AutoFeatureExtractor.from_pretrained
  pretrained_model_name_or_path: facebook/w2v-bert-2.0
