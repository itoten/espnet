##########################################################
#                    TRAINING SETTING                    #
##########################################################
# Settings shared by every encoder. Run with one of the per-encoder configs,
# `conf/training_<encoder>.yaml`, which add the frontend from
# `conf/frontend/<encoder>.yaml` and the experiment tag; this file alone has no
# frontend. Run the three steps as separate commands: under multi-GPU DDP,
# Lightning re-runs the whole command once per GPU, so data preparation or
# inference chained onto `train` would run several times at once.
#   python run.py --stages create_dataset remove_long_short prepare_labels \
#       collect_stats --training_config conf/training_wavlm_large.yaml
#   python run.py --stages train --training_config conf/training_wavlm_large.yaml
#   python run.py --stages infer measure \
#       --training_config conf/training_wavlm_large.yaml \
#       --inference_config conf/inference_wavlm_large.yaml \
#       --metrics_config conf/metrics.yaml
#
##########################################################
#                  SYSTEM AND PATH SETTING               #
##########################################################
# Left empty on purpose. Without it ESPnet3 instantiates `model` through Hydra
# instead of routing it to an ESPnet2 task.
task:

# `dataset/builder.py` writes the merged manifests here; the WAV files stay
# wherever each corpus's own `<CORPUS>_OUTPUT` points.
data_dir: ${oc.env:MULTICORPUS_OOD20_OUTPUT,./data}

##########################################################
#              LONG/SHORT FILTERING SETTING              #
##########################################################
# Applied to training only; eval sets stay unfiltered. 0.5 s keeps every clip
# above the 11 frames the encoders' time masking needs
# (`mask_time_length: 10` at 20 ms per frame), about 0.22 s at 16 kHz.
remove_long_short:
  min_wav_duration: 0.5
  max_wav_duration: 30
  splits:
    - train
    - valid
  save_path: ${data_dir}/manifest_filtered
  manifest_paths:
    train: ${data_dir}/manifest/train.tsv
    valid: ${data_dir}/manifest/valid.tsv

##########################################################
#                  LABEL INVENTORY SETTING               #
##########################################################
prepare_labels:
  save_path: ${data_dir}
  filename: token_list
  weights_filename: class_weights
  manifest_path: ${data_dir}/manifest_filtered/train.tsv
  add_symbol:
    - "<unk>:-1"

##########################################################
#                    DATASET DEFINITION                  #
##########################################################
# `valid` is a placeholder (see `dataset/config.yaml`): `DataOrganizer`
# requires it, but `limit_val_batches: 0` below means it is never evaluated.
# Eval sets are listed in `conf/inference*.yaml` only.
dataset:
  train:
    - data_src_args:
        split: train
  valid:
    - data_src_args:
        split: valid
  preprocessor:
    _target_: espnet2.train.preprocessor.CommonPreprocessor
    fs: 16000
    text_name: label
    token_type: word
    token_list: ${data_dir}/token_list

##########################################################
#                      MODEL SETTING                     #
##########################################################
model:
  _target_: espnet3.systems.cls.model.ClsModel
  # Set by `conf/training_<encoder>.yaml` from `conf/frontend/<encoder>.yaml`.
  frontend: ${frontend}
  # Every label in `dataset/config.yaml`'s `label_map` target set. Must match
  # the line count of `token_list` minus its final `<unk>`.
  num_classes: 20
  head_size: 1024
  head_layers: 1
  dropout: 0.5
  class_weights: ${data_dir}/class_weights

##########################################################
#                  OPTIMIZATION SETTING                  #
##########################################################
optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-5

# Never triggers: these checkpoints are written after validation, which is
# disabled. The model after the last epoch (`last.ckpt`) is the one scored.
best_model_criterion:
  - - valid/acc
    - 1
    - max

seed: 0

##########################################################
#                   DATALOADER SETTING                   #
##########################################################
dataloader:
  train:
    iter_factory:
      batches:
        type: folded
        batch_size: 8
        fold_lengths: [160000]
        sort_in_batch: descending
        sort_batch: descending
  valid:
    iter_factory:
      batches:
        fold_lengths: [160000]
        sort_in_batch: descending
        sort_batch: descending

##########################################################
#                     TRAINER SETTING                    #
##########################################################
trainer:
  devices: ${num_device}
  num_nodes: ${num_nodes}
  gradient_clip_val: 5.0
  # Fixed length, no early stopping: training must not depend on any
  # validation set.
  max_epochs: 30
  # Effective batch is `batch_size` x devices (24 on 3 GPUs).
  accumulate_grad_batches: 1
  limit_val_batches: 0
  num_sanity_val_steps: 0

# Set `RESUME_CKPT=<exp_dir>/last.ckpt` to continue an interrupted run.
fit:
  ckpt_path: ${oc.env:RESUME_CKPT,null}
