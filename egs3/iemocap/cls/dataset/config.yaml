builder:
  # Source layout ---------------------------------------------------------
  # The official release: labels from `Session*/dialog/EmoEvaluation/*.txt`,
  # audio from `Session*/sentences/wav/<dialog>/<turn>.wav`.
  source_env_var: IEMOCAP
  dataset_path: download

  # Download --------------------------------------------------------------
  # Needs a signed release agreement (https://sail.usc.edu/iemocap/), so it is
  # not downloaded here. Point `IEMOCAP` at a copy holding `Session1`-`Session5`.

  # Labels ----------------------------------------------------------------
  # Every code in the evaluation files is a class; none is dropped. `happy`
  # and `excited` stay separate classes. `xxx` marks utterances for which the
  # release found no majority label (its README); it is kept as its own class
  # `no_majority`. Scripted and improvised dialogs are both used.
  emotion_map:
    ang: angry
    hap: happy
    exc: excited
    sad: sad
    neu: neutral
    fea: fear
    fru: frustrated
    sur: surprise
    dis: disgust
    oth: other
    xxx: no_majority

  # Split -----------------------------------------------------------------
  # Utterances are split at random within each label; sessions and speakers
  # are not held out, so every split shares all ten speakers.
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  output_env_var: IEMOCAP_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
