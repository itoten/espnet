builder:
  # Source layout ---------------------------------------------------------
  # `<source>/<Emotion>/<Emotion>_<NNN>.opus`, 200 files per folder, from
  # Kaggle (free account). `prepare_source` fetches it with the Kaggle CLI,
  # which needs an API token (~/.kaggle/access_token or $KAGGLE_API_TOKEN),
  # as jlcorpus/cls does.
  source_env_var: SARAIKI_SER
  dataset_path: download
  kaggle_url: https://www.kaggle.com/datasets/mrjunaidsiyal/speech-emotion-recognition-saraiki-audio-dataset
  kaggle_dataset: mrjunaidsiyal/speech-emotion-recognition-saraiki-audio-dataset
  remove_archive: true
  # Fewer files means an incomplete extraction.
  expected_files: 1200

  # Labels ----------------------------------------------------------------
  # Folder name to manifest label.
  emotion_map:
    Angry: angry
    Fear: fear
    Happy: happy
    Neutral: neutral
    Sad: sad
    Shock: shock

  # Duplicates ------------------------------------------------------------
  # Recordings with the same sound (identical after decoding, or a waveform
  # correlation of 0.998 or more) and the same label as another one
  # (5 utterances; the first of each group by id is kept). With
  # `exclude_duplicates: true` these are left out; `false` uses every recording.
  exclude_duplicates: false
  duplicate_ids:
    - saraiki_ser-neutral_024
    - saraiki_ser-neutral_096
    - saraiki_ser-shock_041
    - saraiki_ser-shock_177
    - saraiki_ser-shock_199

  # Split -----------------------------------------------------------------
  # No partition or speaker id is published, so the split is a random one
  # within each label; speakers cannot be held out.
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # The recordings are 48 kHz mono opus; `build()` converts them to 16 kHz wav.
  output_env_var: SARAIKI_SER_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
