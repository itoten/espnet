builder:
  # Source layout ---------------------------------------------------------
  # `<01Neutral|02Fearful|03Happy|04Sad|05Angry>/<emotion><folder>-<sentence>-
  # <repeat>-<gender>-<speaker>.wav`, e.g. `01Neutral/n1-01-01-01-01.wav`.
  source_env_var: ASED
  dataset_path: download

  # Download --------------------------------------------------------------
  # The authors' GitHub repository wgwangang/ASED_V1, pinned to its latest
  # commit. The README states no license or terms of use.
  download_url: https://github.com/wgwangang/ASED_V1/archive/3feb6d25ec1a88d770594c88d2c4e6cae5c0d046.zip
  archive_name: ased.zip
  remove_archive: true

  # Labels ----------------------------------------------------------------
  # The file name's one-letter emotion code to manifest label. The digit
  # after it must agree with the folder the file sits in.
  emotion_map:
    a: angry
    f: fear
    h: happy
    n: neutral
    s: sad

  # Duplicates ------------------------------------------------------------
  # 53 pairs of recordings with the same sound, always the same speaker, sentence
  # and emotion in repetitions 1 and 2 (28 pairs would fall in different splits
  # of a random split). With `exclude_duplicates: true` the second file of each
  # pair is left out; set it to false to use every file.
  exclude_duplicates: true
  duplicate_files:
    - a5-02-02-01-37.wav
    - a5-03-02-01-21.wav
    - a5-03-02-01-25.wav
    - a5-04-02-01-21.wav
    - a5-05-02-01-21.wav
    - a5-05-02-01-25.wav
    - a5-06-02-01-21.wav
    - a5-06-02-01-25.wav
    - a5-07-02-01-21.wav
    - a5-07-02-01-25.wav
    - a5-07-02-02-63.wav
    - f2-01-02-01-37.wav
    - f2-03-02-01-21.wav
    - f2-04-01-01-25.wav
    - f2-05-02-01-13.wav
    - f2-05-02-01-21.wav
    - f2-05-02-02-50.wav
    - f2-06-02-01-21.wav
    - f2-07-02-01-25.wav
    - h3-01-02-01-49.wav
    - h3-01-02-02-08.wav
    - h3-02-02-01-49.wav
    - h3-03-02-01-21.wav
    - h3-04-02-01-21.wav
    - h3-06-02-01-11.wav
    - h3-06-02-01-21.wav
    - h3-07-01-01-25.wav
    - h3-07-02-01-21.wav
    - h3-07-02-01-31.wav
    - n1-02-02-01-37.wav
    - n1-03-02-01-21.wav
    - n1-03-02-01-25.wav
    - n1-04-02-01-21.wav
    - n1-04-02-01-25.wav
    - n1-05-02-01-21.wav
    - n1-05-02-01-25.wav
    - n1-06-02-01-21.wav
    - n1-06-02-01-25.wav
    - n1-06-02-01-58.wav
    - n1-07-02-01-21.wav
    - n1-07-02-01-25.wav
    - n1-07-02-01-29.wav
    - n1-07-02-02-53.wav
    - s4-03-02-01-21.wav
    - s4-03-02-01-23.wav
    - s4-03-02-01-25.wav
    - s4-04-02-01-21.wav
    - s4-05-02-01-21.wav
    - s4-05-02-01-25.wav
    - s4-06-02-01-21.wav
    - s4-07-02-01-21.wav
    - s4-07-02-01-25.wav
    - s4-07-02-02-57.wav

  # Split -----------------------------------------------------------------
  # No partition is published. Utterances are split at random within each
  # label; speakers are not held out.
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # `build()` converts the recordings to 16 kHz mono.
  output_env_var: ASED_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
