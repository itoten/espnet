builder:
  # Source layout ---------------------------------------------------------
  # One flat directory of `<actor>_<emotion><index>.wav`, e.g. `DC_a01.wav`.
  source_env_var: SAVEE
  dataset_path: download

  # Download --------------------------------------------------------------
  # Needs a free registration at https://cvssp.org/savee/Download.html, so it
  # is not downloaded here. A single zip placed in `$SAVEE` is extracted.
  archive_glob: "*.zip"

  # Labels ----------------------------------------------------------------
  # File-name emotion code to manifest label.
  emotion_map:
    n: neutral
    h: happy
    sa: sad
    a: angry
    f: fear
    d: disgust
    su: surprise

  # Split -----------------------------------------------------------------
  # No partition is published. Utterances are split at random within each
  # label; speakers are not held out, so every split shares all four speakers.
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # The recordings are 44.1 kHz, so `build()` resamples them.
  output_env_var: SAVEE_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
