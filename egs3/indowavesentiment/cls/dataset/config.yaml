builder:
  # Source layout ---------------------------------------------------------
  # `audio/<actor>-<emotion>-<intensity>-<repetition>.wav`, e.g.
  # `audio/07-03-02-03.wav`: actor 01-10 (odd numbers male, even female), emotion
  # code 01-05, intensity 01 (normal) or 02 (strong), repetition 01-03.
  source_env_var: INDOWAVESENTIMENT
  dataset_path: download
  recordings_dir: audio

  # Download --------------------------------------------------------------
  # Mendeley Data dataset j9ytfdzy27 (CC BY 4.0), the authors' own upload.
  # The listing gives each file's size and SHA-256, which are checked.
  dataset_url: https://data.mendeley.com/public-api/datasets/j9ytfdzy27
  user_agent: Mozilla/5.0
  expected_files: 300
  num_workers: 8

  # Labels ----------------------------------------------------------------
  # The emotion code in the file name to manifest label, from the release's
  # `IndoWaveSentiment File Naming Guidelines.pdf`. `disappointed` has no
  # counterpart among the other recipes' labels and is kept as its own class.
  emotion_map:
    "01": neutral
    "02": happy
    "03": surprise
    "04": disgust
    "05": disappointed

  # Split -----------------------------------------------------------------
  # No partition is published. Utterances are split at random within each
  # label, so the splits share the 10 actors and, according to the description,
  # the sentence each actor repeats.
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # `build()` converts the recordings to 16 kHz mono 16-bit WAV.
  output_env_var: INDOWAVESENTIMENT_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
