builder:
  # Source layout ---------------------------------------------------------
  # Flat folder of `ss<set>_s<sentence>_sp<speaker>_<gender>_<emotion>.wav`.
  source_env_var: BANSPEMO
  dataset_path: download

  # Download --------------------------------------------------------------
  # Mendeley Data rdwn4bs5ky version 1, CC BY 4.0. Mendeley publishes no
  # checksum for the archive it builds on request.
  archive_url: https://data.mendeley.com/public-api/zip/rdwn4bs5ky/download/1
  archive_name: BanSpEmo.zip
  # Fewer files means an interrupted extraction.
  expected_files: 792
  remove_archive: true

  # Labels ----------------------------------------------------------------
  # The file name's emotion code to manifest label.
  emotion_map:
    "01": angry
    "02": disgust
    "03": fear
    "04": happy
    "05": sad
    "06": surprise

  # Split -----------------------------------------------------------------
  # No partition is published. Utterances are split at random within each
  # label; speakers are not held out, so the splits share all speakers.
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # `build()` resamples the recordings to 16 kHz mono.
  output_env_var: BANSPEMO_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
