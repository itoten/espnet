builder:
  # Source layout ---------------------------------------------------------
  # `recordings/<speaker>/<style>/<speaker>_<style>_<NNN>.flac` plus one
  # `recordings/<speaker>/index.tsv` per speaker (file, speaker, style,
  # intensity, text). The style is the emotion the speaker was asked to read in.
  source_env_var: TALROMUR3
  dataset_path: download
  recordings_subdir: recordings

  # Download --------------------------------------------------------------
  # CLARIN-IS item 20.500.12537/387 (v1.0), CC BY 4.0, no login. The item
  # publishes no checksum, so the archive is only checked with `zipfile.testzip`.
  archive_url: https://repository.clarin.is/repository/xmlui/bitstream/handle/20.500.12537/387/recordings.zip?sequence=6&isAllowed=y
  archive_name: recordings.zip
  # Fewer files means an interrupted extraction.
  expected_files: 21516
  remove_archive: true

  # Labels ----------------------------------------------------------------
  # Style directory (`suprised` is a spelling error in one speaker's
  # directory) to manifest label. `helpful` is a speaking style, not an
  # emotion, but is one of the corpus's six classes and is kept.
  emotion_map:
    neutral: neutral
    happy: happy
    sad: sad
    angry: angry
    surprised: surprise
    suprised: surprise
    helpful: helpful
  # The addendum (alphabet and numbers 0-20 read aloud) is not one of the six
  # styles; left out. Remove it from this list and map it above to use it.
  drop_styles:
    - addendum
    - addendum_style2

  # Split -----------------------------------------------------------------
  # No partition is published. Whole speakers are held out; the listed speakers
  # are fixed so that test and valid each hold both genders where possible.
  test_speakers: [F04, M04]
  valid_speakers: [M05]

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # The recordings are 48 kHz 24-bit mono FLAC; `build()` converts them to
  # 16 kHz 16-bit mono WAV with `build_workers` parallel ffmpeg processes.
  output_env_var: TALROMUR3_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000
  build_workers: 8

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
