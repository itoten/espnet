builder:
  # Source layout ---------------------------------------------------------
  # `Sounds/<actor>_<emotion>.wav` plus the tab-separated `Sounds.csv`
  # (Filename, Actor_ID, Emotion, Sex, acoustic measures). The emotion is the
  # intended (acted) one.
  source_env_var: MAV
  dataset_path: download
  audio_subdir: Sounds
  table_name: Sounds.csv

  # Download --------------------------------------------------------------
  # Zenodo record 17036776, CC BY 4.0 (7.6 MB zip plus the 5.5 kB table).
  base_url: https://zenodo.org/api/records/17036776/files
  archive_name: Sounds.zip
  archive_md5: f4126daa6f624a9230bb0090dbd3d3c2
  table_md5: 69b499bd5f2bf65dee9b43d7eaf4fa32
  # Fewer files means an interrupted extraction.
  expected_files: 90
  remove_archive: true

  # Labels ----------------------------------------------------------------
  # The emotion in `Sounds.csv` to manifest label. `pain` and `pleasure` are
  # kept as they are in the corpus.
  emotion_map:
    anger: angry
    disgust: disgust
    fear: fear
    happiness: happy
    neutral: neutral
    pain: pain
    pleasure: pleasure
    sadness: sad
    surprise: surprise

  # Split -----------------------------------------------------------------
  # No partition is published. Whole actors are held out: with 10 actors the
  # ratios give 7 train, 1 valid and 2 test actors, picked by `split_seed`.
  # Each actor recorded every emotion once, so every split holds all 9 labels.
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # The recordings are 44.1 kHz mono; `build()` converts them to 16 kHz.
  output_env_var: MAV_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
