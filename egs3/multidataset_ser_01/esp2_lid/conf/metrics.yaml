##########################################################
#                 METRIC SCORING SETTING                 #
##########################################################
# `ref` is the test set's `lid_labels` field, read from the data; `hyp` is
# `<test_name>/language.scp`, written by `infer`. `Accuracy` is WA;
# `ClassificationReport` gives per-class precision, recall and F1, and its
# macro-averaged recall is UA. The inference writes no per-class scores, so
# `../cls`'s mAP and AUC are not available.
inference_dir: ${exp_dir}/inference

metrics:
  - metric:
      _target_: espnet3.systems.esp2_lid.metrics.accuracy.Accuracy
    inputs:
      ref: dataset:lid_labels
      hyp: language
  - metric:
      _target_: espnet3.systems.esp2_lid.metrics.classification_report.ClassificationReport
    inputs:
      ref: dataset:lid_labels
      hyp: language
