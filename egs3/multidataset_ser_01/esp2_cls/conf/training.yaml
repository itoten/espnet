##########################################################
#                    TRAINING SETTING                    #
##########################################################
# Log-mel features and a Transformer encoder trained from scratch (no
# pre-trained model).
#
# The data is that of `egs3/multidataset_ser_01/cls`: the same merged
# manifests, the same `remove_long_short` output and the same label list. Run
# that recipe's data preparation first; this recipe does not repeat it.
#   (in ../cls) python run.py --stages create_dataset remove_long_short \
#       prepare_labels --training_config conf/training_wavlm_large.yaml
#   python run.py --stages collect_stats --training_config conf/training.yaml
#   python run.py --stages train --training_config conf/training.yaml
#   python run.py --stages infer measure \
#       --training_config conf/training.yaml \
#       --inference_config conf/inference.yaml \
#       --metrics_config conf/metrics.yaml
#
# Run the steps as separate commands: under multi-GPU DDP, Lightning re-runs
# the whole command once per GPU. Run `collect_stats` and `train` separately
# in any case: in one command, `collect_stats` drops `normalize` from the
# configuration and `train` then normalises each utterance by its own mean
# (`utterance_mvn`) instead of the training set's statistics.

##########################################################
#                  SYSTEM AND PATH SETTING               #
##########################################################
task: espnet3.systems.esp2_cls.task.CLSTask

# Where `../cls` writes the merged manifests and `token_list`. Must be the
# same expression as in `../cls/conf/training.yaml`, resolved from that
# recipe's directory.
data_dir: ${oc.env:MULTIDATASET_SER_01_OUTPUT,../cls/data}
# Set MULTIDATASET_SER_01_EXP_TAG to write a run to another directory under
# `exp/` (give the same value to `infer` and `measure`, which read it here).
exp_tag: ${oc.env:MULTIDATASET_SER_01_EXP_TAG,train_transformer}

# `create_dataset` is `../cls`'s; if run from here it works on that recipe.
create_dataset:
  recipe_dir: ${recipe_dir}/../cls
  only: ${oc.env:MULTIDATASET_SER_01_ONLY,null}

# Workers for `collect_stats`, which computes log-mel features of every
# training and validation utterance. Set MULTIDATASET_SER_01_WORKERS to the
# number of CPU cores to use; 1 by default.
parallel:
  env: local
  n_workers: ${oc.decode:${oc.env:MULTIDATASET_SER_01_WORKERS,1}}
  allow_overwrite_lock: false

##########################################################
#                    DATASET DEFINITION                  #
##########################################################
# `train` and `valid` read `../cls`'s `manifest_filtered` (0.5 to 30 s).
dataset:
  train:
    - data_src_args:
        split: train
  valid:
    - data_src_args:
        split: valid
  preprocessor:
    _target_: espnet2.train.preprocessor.CommonPreprocessor
    fs: 16000
    text_name: label
    token_type: word
    token_list: ${data_dir}/token_list

##########################################################
#                      MODEL SETTING                     #
##########################################################
# Sizes are provisional.
model:
  token_list: ${data_dir}/token_list
  # 80 log-mel bins, 25 ms window, 10 ms shift.
  frontend: default
  frontend_conf:
    fs: 16000
    n_fft: 512
    win_length: 400
    hop_length: 160
    n_mels: 80
  specaug: specaug
  specaug_conf:
    apply_time_warp: false
    apply_freq_mask: true
    freq_mask_width_range: [0, 27]
    num_freq_mask: 2
    apply_time_mask: true
    time_mask_width_ratio_range: [0.0, 0.05]
    num_time_mask: 2
  # Mean and variance of the training set's features, from `collect_stats`.
  normalize: global_mvn
  normalize_conf:
    stats_file: ${stats_dir}/train/feats_stats.npz
  encoder: transformer
  encoder_conf:
    output_size: 256
    attention_heads: 4
    linear_units: 1024
    num_blocks: 12
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    attention_dropout_rate: 0.1
    # 4x subsampling: 25 frames per second into the blocks.
    input_layer: conv2d
    normalize_before: true
  # Mean pooling over time, then a linear layer to the classes.
  decoder: linear
  model_conf:
    classification_type: multi-class

##########################################################
#                  OPTIMIZATION SETTING                  #
##########################################################
# Not tuned yet. Peak lr 1e-3 for about 256 utterances a step (8 GPUs).
# AdamW (decoupled weight decay) as in `../cls`; beta2 0.98 as usual for a
# Transformer trained from scratch.
optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-3
  weight_decay: 0.01
  betas: [0.9, 0.98]

# Warm up from 1 % of `lr` over the first 10 % of the updates, hold for 40 %,
# then decay to 5 % of `lr` over the last 50 % (the same shape as `../cls`).
# `max_steps` counts optimizer updates over the whole run: 40 epochs of 1,153
# updates, the number on 8 GPUs with the batches below (one GPU makes 8 times
# as many). Recompute it when the batch, the GPU count or `max_epochs`
# changes.
# Written under its own key and referenced from `scheduler`: a `scheduler`
# block here would be merged into the TEMPLATE's WarmupLR block, whose
# `warmup_steps` TristageLR does not take.
lr_schedule:
  _target_: espnet2.schedulers.tristage_lr.TristageLR
  max_steps: 46120
  warmup_ratio: 0.1
  hold_ratio: 0.4
  decay_ratio: 0.5
  init_lr_scale: 0.01
  final_lr_scale: 0.05
scheduler: ${lr_schedule}
scheduler_interval: step

# The checkpoint with the best validation accuracy is kept
# (`valid.acc.ave_1best.pth`) and is the one `conf/inference.yaml` scores.
best_model_criterion:
  - - valid/acc
    - 1
    - max

seed: 0

##########################################################
#                   DATALOADER SETTING                   #
##########################################################
# `batch_size` is per GPU. `fold_lengths` counts feature frames (100 per
# second), so a batch with an utterance longer than 10 s is made smaller.
dataloader:
  train:
    iter_factory:
      num_workers: 8
      batches:
        type: folded
        batch_size: 32
        fold_lengths: [1000]
        sort_in_batch: descending
        sort_batch: descending
  valid:
    iter_factory:
      num_workers: 8
      batches:
        type: folded
        batch_size: 32
        fold_lengths: [1000]
        sort_in_batch: descending
        sort_batch: descending

##########################################################
#                     TRAINER SETTING                    #
##########################################################
# Not tuned yet. About 264,000 training utterances: one epoch is 1,153 steps
# on 8 GPUs (about 9,200 on one). Validation runs after every epoch.
# `patience` is wide enough that training is not stopped before the lr decay
# (the last 20 epochs). The number of GPUs is NUM_DEVICE (1 by default; DDP
# when more).
trainer:
  devices: ${num_device}
  num_nodes: ${num_nodes}
  gradient_clip_val: 5.0
  max_epochs: 40
  accumulate_grad_batches: 1
  callbacks:
    - _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: valid/acc
      mode: max
      patience: 10
    # Also keep the weights of every epoch under `<exp_dir>/epochs/`, to score
    # the evaluation sets epoch by epoch. `mode` only keeps this callback apart
    # from ESPnet3's own `last.ckpt` checkpointer, which Lightning would
    # otherwise reject as a duplicate; nothing is monitored.
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      dirpath: ${exp_dir}/epochs
      filename: epoch{epoch}
      auto_insert_metric_name: false
      save_top_k: -1
      every_n_epochs: 1
      save_weights_only: true
      mode: max

# Set `RESUME_CKPT=<exp_dir>/last.ckpt` to continue an interrupted run.
fit:
  ckpt_path: ${oc.env:RESUME_CKPT,null}
