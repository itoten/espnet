# Training with the `wavlm_large` frontend (`conf/frontend/wavlm_large.yaml`).
# Everything else comes from `conf/training.yaml`.
defaults:
  - training
  - frontend: wavlm_large
  - _self_

# Set MULTIDATASET_SER_01_EXP_TAG to write a run to another directory under
# `exp/` (give the same value to `infer` and `measure`, which read it here).
exp_tag: ${oc.env:MULTIDATASET_SER_01_EXP_TAG,train_wavlm_large}
