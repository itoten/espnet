# Training with the `hubert_large` frontend (`conf/frontend/hubert_large.yaml`)
# on one GPU (NUM_DEVICE=1). Everything not set here comes from
# `conf/training.yaml`.
#
# Set for speed on a single H200, measured over 300 batches each (one GPU
# processed 2,720 seconds of audio a second, against 1,854 before the last
# four items):
# - SDPA attention (`attn_implementation: sdpa` in the frontend).
# - Each transformer layer compiled with `torch.compile`. Compiling groups of
#   4 or all 24 layers as one piece was no faster.
# - The frozen convolutional feature encoder compiled as well (+17 %).
# - No DDP wrapper on one GPU (`strategy: auto`, +3.5 %).
# - Batches of 21 minutes of audio (`batch_bins`), one update each. Between 12
#   and 21 minutes the speed hardly changes (+3 % at 21); 21 minutes peaks at
#   about 94 GB of the 141 GB of an H200. Use `batch_bins: 11520000` (12
#   minutes) on a GPU with less memory.
# The pooling of the classifier also had to be batched (code change in
# `espnet3/systems/cls/src/pooling.py`, +19 %).
defaults:
  - training
  - frontend: hubert_large
  - _self_

# Set MULTIDATASET_SER_01_EXP_TAG to write a run to another directory under
# `exp/` (give the same value to `infer` and `measure`, which read it here).
exp_tag: ${oc.env:MULTIDATASET_SER_01_EXP_TAG,train_hubert_large}

frontend:
  compile_layers: true
  compile_feature_encoder: true

# Fused AdamW is not used: with `gradient_clip_val` set, Lightning's mixed
# precision plugin refuses any optimizer that unscales gradients itself, even
# under bf16 where there is no scaler. It gained only about 2 % anyway.

dataloader:
  train:
    iter_factory:
      batches:
        batch_bins: 20160000

# `auto` is a plain single-GPU run on one GPU. With NUM_DEVICE above 1 set
# `strategy: ddp_find_unused_parameters_true`: LayerDrop skips layers at
# random, so some parameters get no gradient in a step.
trainer:
  strategy: auto
  accumulate_grad_batches: 1

# 1,262 batches (= updates) an epoch with the `batch_bins` above, 37,860 over
# 30 epochs. Recompute when the batch, the GPU count or `max_epochs` changes.
lr_schedule:
  max_steps: 37860
