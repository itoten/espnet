##########################################################
#                 METRIC SCORING SETTING                 #
##########################################################
# The same five metrics as `egs3/TEMPLATE/cls/conf/metrics.yaml`, each with
# `unknown_reference: score`. Test sets are discovered from the
# subdirectories of `inference_dir`, which `run.py` copies from the
# inference config. UA and MacroF1 average over the classes present in each
# set's reference labels.
#
# The evaluation sets keep only the seven classes the model has
# (`labels` in `dataset/config.yaml`), so no reference is unknown and
# `unknown_reference` does not come into play. A set that lacks some of the
# seven (e.g. legov2 has only angry and neutral) is averaged over the classes
# it has.
data_dir: ${oc.env:MULTIDATASET_SER_01_OUTPUT,./data}

metrics:
  - metric:
      _target_: espnet3.systems.cls.metrics.wa.WA
    inputs:
      ref: ref   # `<test_name>/ref.scp`, written by infer
      hyp: hyp   # `<test_name>/hyp.scp`

  - metric:
      _target_: espnet3.systems.cls.metrics.ua.UA
      token_list: ${data_dir}/token_list
      unknown_reference: score
    inputs:
      ref: ref   # `<test_name>/ref.scp`, written by infer
      hyp: hyp   # `<test_name>/hyp.scp`

  - metric:
      _target_: espnet3.systems.cls.metrics.macro_f1.MacroF1
      token_list: ${data_dir}/token_list
      unknown_reference: score
    inputs:
      ref: ref   # `<test_name>/ref.scp`, written by infer
      hyp: hyp   # `<test_name>/hyp.scp`

  - metric:
      _target_: espnet3.systems.cls.metrics.mean_ap.MAP
      token_list: ${data_dir}/token_list
      unknown_reference: score
    inputs:
      ref: ref
      score: score

  - metric:
      _target_: espnet3.systems.cls.metrics.auc.AUC
      token_list: ${data_dir}/token_list
      unknown_reference: score
    inputs:
      ref: ref
      score: score
