##########################################################
#                    TRAINING SETTING                    #
##########################################################
# Settings shared by every encoder. Run with a per-encoder config,
# `conf/training_<encoder>.yaml`, which adds the frontend from
# `conf/frontend/<encoder>.yaml` and the experiment tag; this file alone has no
# frontend. Run the steps as separate commands: under multi-GPU DDP,
# Lightning re-runs the whole command once per GPU, so data preparation or
# inference chained onto `train` would run several times at once.
#   python run.py --stages create_dataset remove_long_short prepare_labels \
#       collect_stats --training_config conf/training_wavlm_large.yaml
#   python run.py --stages train --training_config conf/training_wavlm_large.yaml
#   python run.py --stages infer measure \
#       --training_config conf/training_wavlm_large.yaml \
#       --inference_config conf/inference_wavlm_large.yaml \
#       --metrics_config conf/metrics.yaml
#
# `create_dataset` downloads and converts the corpora listed in
# `dataset/config.yaml` (each with its own `egs3/<corpus>/cls` recipe), then
# writes this recipe's merged manifests. Set MULTIDATASET_SER_01_ONLY to a
# space-separated list of corpus names to prepare only those, e.g.
# MULTIDATASET_SER_01_ONLY="ravdess emodb"; the merged manifests are then not
# written.
#
##########################################################
#                  SYSTEM AND PATH SETTING               #
##########################################################
# Left empty on purpose. Without it ESPnet3 instantiates `model` through Hydra
# instead of routing it to an ESPnet2 task.
task:

# The merged manifests and the stage logs are written here. The WAV files
# stay wherever each corpus's own `<CORPUS>_OUTPUT` points.
data_dir: ${oc.env:MULTIDATASET_SER_01_OUTPUT,./data}

create_dataset:
  recipe_dir: ${recipe_dir}
  only: ${oc.env:MULTIDATASET_SER_01_ONLY,null}

##########################################################
#              LONG/SHORT FILTERING SETTING              #
##########################################################
# Applied to training and validation only; the evaluation sets stay
# unfiltered. 0.5 s keeps every clip above the 11 frames the encoders' time
# masking needs (`mask_time_length: 10` at 20 ms per frame), about 0.22 s at
# 16 kHz.
remove_long_short:
  min_wav_duration: 0.5
  max_wav_duration: 30
  splits:
    - train
    - valid
  save_path: ${data_dir}/manifest_filtered
  manifest_paths:
    train: ${data_dir}/manifest/train.tsv
    valid: ${data_dir}/manifest/valid.tsv

##########################################################
#                  LABEL INVENTORY SETTING               #
##########################################################
prepare_labels:
  save_path: ${data_dir}
  filename: token_list
  weights_filename: class_weights
  manifest_path: ${data_dir}/manifest_filtered/train.tsv
  add_symbol:
    - "<unk>:-1"

##########################################################
#                    DATASET DEFINITION                  #
##########################################################
# `valid` is taken out of the training corpora as `validation` in
# `dataset/config.yaml` says. The evaluation sets are listed in
# `conf/inference.yaml` only.
dataset:
  train:
    - data_src_args:
        split: train
  valid:
    - data_src_args:
        split: valid
  preprocessor:
    _target_: espnet2.train.preprocessor.CommonPreprocessor
    fs: 16000
    text_name: label
    token_type: word
    token_list: ${data_dir}/token_list

##########################################################
#                      MODEL SETTING                     #
##########################################################
model:
  _target_: espnet3.systems.cls.src.model.ClsModel
  # Set by `conf/training_<encoder>.yaml` from `conf/frontend/<encoder>.yaml`.
  frontend: ${frontend}
  # `labels` in `dataset/config.yaml`. Must match the line count of
  # `token_list` minus its final `<unk>`.
  num_classes: 7
  head_size: 1024
  head_layers: 1
  dropout: 0.5
  class_weights: ${data_dir}/class_weights

##########################################################
#                  OPTIMIZATION SETTING                  #
##########################################################
# The same optimizer as egs3/multicorpus_ood20/cls. Not tuned for this data.
optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-5

# The checkpoint with the best validation accuracy is kept
# (`valid.acc.ave_1best.pth`) and is the one `conf/inference.yaml` scores.
best_model_criterion:
  - - valid/acc
    - 1
    - max

seed: 0

##########################################################
#                   DATALOADER SETTING                   #
##########################################################
dataloader:
  train:
    iter_factory:
      batches:
        type: folded
        batch_size: 8
        fold_lengths: [160000]
        sort_in_batch: descending
        sort_batch: descending
  valid:
    iter_factory:
      batches:
        fold_lengths: [160000]
        sort_in_batch: descending
        sort_batch: descending

##########################################################
#                     TRAINER SETTING                    #
##########################################################
# Provisional, not tuned: about 265,000 training utterances, so one epoch is
# about 33,000 batches per GPU at batch size 8. Validation runs after every
# epoch and stops training when the validation accuracy has not improved for
# `patience` epochs.
trainer:
  devices: ${num_device}
  num_nodes: ${num_nodes}
  gradient_clip_val: 5.0
  max_epochs: 10
  # Effective batch is `batch_size` x devices x `accumulate_grad_batches`.
  accumulate_grad_batches: 1
  callbacks:
    - _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: valid/acc
      mode: max
      patience: 3

# Set `RESUME_CKPT=<exp_dir>/last.ckpt` to continue an interrupted run.
fit:
  ckpt_path: ${oc.env:RESUME_CKPT,null}
