builder:
  # Source layout ---------------------------------------------------------
  # `JNV/<F1|F2|M1|M2>/<speaker>_<emotion>_<id>_<R|F>.wav`. The emotion is the
  # intended (prompted) one.
  source_env_var: JNV
  dataset_path: download

  # Download --------------------------------------------------------------
  # CC BY-SA 4.0, 326 MB zip from the author's site (no login). Only the wav
  # files are kept.
  archive_url: https://ss-takashi.sakura.ne.jp/corpus/jnv/jnv_corpus_ver3.zip
  archive_name: jnv_corpus_ver3.zip
  archive_bytes: 325502055
  # Fewer files means an interrupted extraction.
  expected_files: 420
  remove_archive: true

  # Labels ----------------------------------------------------------------
  # The emotion in the file name to manifest label.
  emotion_map:
    angry: angry
    disgust: disgust
    fear: fear
    happy: happy
    sad: sad
    surprise: surprise

  # Split -----------------------------------------------------------------
  # No partition is published. Utterances are split at random within each
  # label; speakers are not held out, so every split shares all 4 speakers.
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # The recordings are 48 kHz stereo; `build()` converts them to 16 kHz mono.
  output_env_var: JNV_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
