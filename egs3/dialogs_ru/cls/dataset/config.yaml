builder:
  # Source layout ---------------------------------------------------------
  # `<source>/wavs/*.wav` and the pipe-delimited (`|`) split files
  # `<source>/{train,val,test}.csv`, columns
  # `audio_path|speaker_id|text|emotion|emotion_on_russian|accent_text|duration`.
  # `audio_path` is relative to the source root (`wavs/<name>.wav`).
  #
  # The release is incomplete: the split files list 11,796 utterances, but
  # `wavs/` of the pinned revision holds only 9,996 files (counted from the
  # repository's file tree on 2026-11-18). The 1,800 utterances without audio
  # are skipped and counted in the log. A different number of missing files
  # (other than 0, should the release be completed) means a partial download
  # and stops the build.
  missing_audio_expected: 1800
  source_env_var: DIALOGS_RU
  dataset_path: download

  # Download --------------------------------------------------------------
  # Hugging Face dataset langswap/dialogs-ru-emotional-conversations at a
  # pinned commit (open, no login; OpenRAIL, see LICENSE.md). Only the audio
  # and the split files are fetched: `metadata.csv` (the three splits
  # together) and `preview.parquet` (60 sample clips with embedded audio)
  # are not needed.
  hf_repo: langswap/dialogs-ru-emotional-conversations
  hf_revision: a74ff44d8d27ca3d21098ea3ed4d31a32923fbdd
  allow_patterns:
    - wavs/*.wav
    - train.csv
    - val.csv
    - test.csv
    - README.md
    - LICENSE.md

  # Labels ----------------------------------------------------------------
  # The `emotion` column (English; `emotion_on_russian` is the same label in
  # Russian) to manifest label. The corpus has 12 "style/emotion" labels.
  # Seven are emotions and are kept, all of them:
  emotion_map:
    neutral: neutral
    happy: happy
    surprise: surprise
    sad: sad
    angry: angry
    disgust: disgust
    fear: fear
  # The other five are speaking styles or vocal events, not emotions, and
  # are dropped:
  # - `sgorogovrki`: tongue twisters. The dataset card calls this label
  #   `tongue-twister`, but the CSVs spell it `sgorogovrki` (a
  #   transliteration of the Russian word); both spellings are listed.
  # - `poem`: recited poetry (a reading style).
  # - `whisper`: a phonation mode, not an emotion.
  # - `laughing`: a vocal event; its emotion is not labelled.
  # - `arrogance`: a judgement call. It is an attitude rather than one of
  #   the basic emotions and has no counterpart among the seven classes
  #   used by the other recipes, so it is dropped as well.
  drop_emotions:
    - sgorogovrki
    - tongue-twister
    - poem
    - whisper
    - laughing
    - arrogance

  # Duplicates ------------------------------------------------------------
  # Recordings with byte-identical content, found while building this recipe.
  # One pair, same label (neutral) and same transcript, both in train:
  # `masha_sveta_part10_1765` and `masha_sveta_part10_1821`; the second is
  # listed. With `exclude_duplicates: true` it is left out; `false` uses every
  # recording.
  exclude_duplicates: false
  duplicate_ids:
    - dialogs_ru-masha_sveta_part10_1821

  # Split -----------------------------------------------------------------
  # The published split is used; `val` becomes `valid`. The dataset card
  # says validation and test were drawn stratified (5 utterances per speaker
  # per label). There are only three speakers and all three are in every
  # split, so the split is not speaker-independent.
  split_files:
    train: train.csv
    valid: val.csv
    test: test.csv

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # The recordings are 44.1 kHz 16-bit WAV (dataset card); `build()`
  # converts them to 16 kHz mono.
  output_env_var: DIALOGS_RU_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
