builder:
  # Source layout ---------------------------------------------------------
  # `<source>/<name>.wav` for every recording plus `<source>/dataset_file_directory.csv`
  # (columns `Filename`, `Participant`, `Label`).
  source_env_var: RECANVO
  dataset_path: download
  labels_csv: dataset_file_directory.csv

  # Download --------------------------------------------------------------
  # Zenodo record 5786860, CC BY 3.0 US (1.06 GB zip holding the wav files,
  # the label table, a spreadsheet of participant profiles and the authors'
  # preprocessing scripts). Only the wav files and the label table are kept.
  base_url: https://zenodo.org/api/records/5786860/files
  archive_name: ReCANVo.zip
  archive_md5: 228c89ee9e70b3d45cde9eb6467283b3
  # Fewer files means an interrupted extraction.
  expected_files: 7077
  remove_archive: true

  # Labels ----------------------------------------------------------------
  # The 21 classes. `dataset_file_directory.csv` has 22 label strings; `laugh`
  # (8 recordings, all P03) is merged into `laughter` by `label_aliases`, as
  # the paper's Table 2 counts those 8 as laughter. The first six classes are
  # shared by all participants; the rest are optional labels chosen per
  # participant.
  labels:
    - selftalk
    - frustrated
    - delighted
    - dysregulated
    - social
    - request
    - affectionate
    - "yes"
    - laughter
    - dysregulation-sick
    - happy
    - help
    - more
    - protest
    - bathroom
    - dysregulation-bathroom
    - "no"
    - glee
    - tablet
    - hunger
    - greeting
  label_aliases:
    laugh: laughter

  # Split -----------------------------------------------------------------
  # No partition is published. Each (participant, label) group is split at
  # random, so every split holds every participant and label that has enough
  # recordings. Participants are not held out.
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # The recordings are 44.1 kHz, mono or stereo, 16- or 32-bit; `build()`
  # converts them to 16 kHz mono.
  output_env_var: RECANVO_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
