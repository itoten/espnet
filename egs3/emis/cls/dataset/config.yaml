builder:
  # Source layout ---------------------------------------------------------
  # `<sentence>_<text emotion>_<voice emotion>_<ESD speaker>_<TTS>.wav`, e.g.
  # `09_happy_explicit_angry_0016_F5TTS.wav` (1,248 synthetic wav files).
  source_env_var: EMIS
  dataset_path: download

  # Download --------------------------------------------------------------
  # Zenodo record 19207001 (GPL-3.0-or-later), 318.5 MB zip. Zenodo publishes
  # the MD5 only.
  archive_url: https://zenodo.org/api/records/19207001/files/audios_EMIS.zip/content
  archive_name: audios_EMIS.zip
  archive_md5: a78a40ce73eae28dabafc1d16ec703bc
  # Fewer files means an interrupted extraction.
  expected_files: 1248
  remove_archive: true

  # Labels ----------------------------------------------------------------
  # The label is the emotion of the voice (third part of the file name), not the
  # emotion of the sentence.
  emotion_map:
    angry: angry
    happy: happy
    neutral: neutral
    sad: sad

  # Split -----------------------------------------------------------------
  # No partition is published. Each of the 26 sentence groups (the number at the
  # start of the file name) is kept in one split, so a test sentence is never
  # seen in training in another voice; the splits get about 70/10/20 % of the
  # utterances.
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # The recordings are 24 kHz mono; `build()` converts them to 16 kHz.
  output_env_var: EMIS_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
