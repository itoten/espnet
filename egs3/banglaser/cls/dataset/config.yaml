builder:
  # Source layout ---------------------------------------------------------
  # `Actor NN/` folders of `<mode>-<type>-<emotion>-<intensity>-<statement>-
  # <repetition>-<actor>.wav`, below the extracted archive's own top folder.
  source_env_var: BANGLASER
  dataset_path: download

  # Download --------------------------------------------------------------
  # Mendeley Data t9h6p943xy version 5, CC BY 4.0. Mendeley publishes no
  # checksum for the archive it builds on request.
  archive_url: https://data.mendeley.com/public-api/zip/t9h6p943xy/download/5
  archive_name: BanglaSER.zip
  # 34 actors; fewer files means an interrupted extraction.
  expected_files: 1467
  remove_archive: true

  # Labels ----------------------------------------------------------------
  # The file name's emotion code to manifest label.
  emotion_map:
    "01": happy
    "02": sad
    "03": angry
    "04": surprise
    "05": neutral

  # Duplicates ------------------------------------------------------------
  # Recordings with the same sound (identical after decoding, or a waveform
  # correlation of 0.998 or more) and the same label as another one
  # (8 utterances; the first of each group by id is kept). With
  # `exclude_duplicates: true` these are left out; `false` uses every recording.
  exclude_duplicates: true
  duplicate_ids:
    - banglaser-a02-03-01-03-02-01-03-02
    - banglaser-a15-03-01-01-01-03-03-15
    - banglaser-a17-03-01-01-01-01-03-17
    - banglaser-a19-03-01-04-02-03-01-19
    - banglaser-a29-03-01-01-01-03-03-29
    - banglaser-a30-03-01-02-01-02-03-30
    - banglaser-a30-03-01-04-02-01-03-30
    - banglaser-a32-03-01-03-02-03-03-32

  # Split -----------------------------------------------------------------
  # No partition is published. Utterances are split at random within each
  # label; speakers are not held out, so the splits share all speakers.
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # The recordings' sampling rate varies; `build()` resamples to 16 kHz mono.
  output_env_var: BANGLASER_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
