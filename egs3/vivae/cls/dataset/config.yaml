builder:
  # Source layout ---------------------------------------------------------
  # `VIVAE/full_set/<speaker>_<emotion>_<intensity>_<id>.wav`, e.g.
  # `S03_pain_peak_02.wav`. `core_set` is a subset of `full_set` and is ignored.
  # The recordings are non-speech vocalizations (screams, cries, laughs).
  source_env_var: VIVAE
  dataset_path: download
  recordings_dir: VIVAE/full_set

  # Download --------------------------------------------------------------
  # Zenodo record 4066235, CC BY-NC 4.0; `md5` is the checksum Zenodo lists.
  archive_url: https://zenodo.org/api/records/4066235/files/VIVAE.zip/content
  archive_name: VIVAE.zip
  md5: 62383077641fa90f5545e38d7f268e02
  # Fewer recordings means an interrupted extraction.
  expected_files: 1085
  remove_archive: true

  # Labels ----------------------------------------------------------------
  # The file name's emotion word to manifest label. Only `anger` is renamed
  # to match the other recipes; `fear` and `surprise` are among the seven
  # shared labels, `achievement`, `pain` and `pleasure` are not.
  emotion_map:
    anger: angry
    fear: fear
    surprise: surprise
    achievement: achievement
    pain: pain
    pleasure: pleasure

  # Split -----------------------------------------------------------------
  # No partition is published. Utterances are split at random within each
  # label; speakers are not held out, so the splits share all speakers.
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # The release is 44.1 kHz; `build()` converts it to 16 kHz mono.
  output_env_var: VIVAE_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
