builder:
  # enterface05 is the only training corpus here: an in-domain baseline for how
  # enterface05's own emotions are learned alone, to compare against
  # `multicorpus_full20`'s enterface05 test score (same native labels, same
  # test set, only the training data -- solo vs. 10-corpus merge -- differs).
  train_corpora:
    - name: enterface05
      data_src: enterface05/esp2_cls

  # Every native label enterface05 carries, kept as its own class (identity
  # mapping; a few are spelling fixes so the class names match
  # `multicorpus_full20`'s). See espnet_work/label_inventory.md for the
  # source counts.
  label_map:
    angry: angry
    disgust: disgust
    fear: fear
    happy: happy
    sad: sad
    surprise: surprise

  output_env_var: ENTERFACE05_WAVLMASP_OUTPUT
  data_path: data

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv

dataset:
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
