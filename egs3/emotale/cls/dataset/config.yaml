builder:
  # Source layout ---------------------------------------------------------
  # `wav/<DK|EN>_<speaker>_<emotion code>_<sentence>.wav` plus
  # `annotations.csv` and `speaker_info.csv`. The emotion is the enacted
  # (prompted) one, which equals the table's `gt_emotion` for every file.
  source_env_var: EMOTALE
  dataset_path: download
  audio_subdir: wav
  table_name: annotations.csv
  speaker_table_name: speaker_info.csv

  # Download --------------------------------------------------------------
  # Public GitHub repository, pinned to one commit (409 MB of wav files, no
  # login). The repository states no license.
  base_url: https://raw.githubusercontent.com/snehadas/EmoTale/41e7d00f0949d4e7c8d1ae5101a344037ae056de
  # Fewer files means an interrupted download.
  expected_files: 800
  download_workers: 6

  # Labels ----------------------------------------------------------------
  # The emotion code in the file name to manifest label.
  emotion_map:
    A: angry
    B: boredom
    H: happy
    N: neutral
    S: sad

  # Split -----------------------------------------------------------------
  # No partition is published. Whole speakers are held out: with 18 speakers
  # the ratios give 12 train, 2 valid and 4 test speakers, picked by
  # `split_seed`. Danish and English recordings of one speaker id stay together.
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # The recordings are 48 kHz stereo; `build()` converts them to 16 kHz mono.
  output_env_var: EMOTALE_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
