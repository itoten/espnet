##########################################################
#                    TRAINING SETTING                    #
##########################################################
# Quick usage:
#   python run.py --stages create_dataset --training_config conf/training.yaml
#   python run.py --stages remove_long_short prepare_labels collect_stats train \
#       --training_config conf/training.yaml
#
##########################################################
#                  SYSTEM AND PATH SETTING               #
##########################################################
task:

data_dir: ${oc.env:YSED_OUTPUT,./data}
exp_tag: train_cls_ysed

##########################################################
#              LONG/SHORT FILTERING SETTING              #
##########################################################
# WavLM's SpecAugment mask needs at least 11 conv-output frames (about 0.22 s),
# so clips under 0.5 s are dropped with margin.
remove_long_short:
  min_wav_duration: 0.5
  max_wav_duration: 30
  splits:
    - train
    - valid
  save_path: ${data_dir}/manifest_filtered
  manifest_paths:
    train: ${data_dir}/manifest/train.tsv
    valid: ${data_dir}/manifest/valid.tsv

##########################################################
#                  LABEL INVENTORY SETTING               #
##########################################################
prepare_labels:
  save_path: ${data_dir}
  filename: token_list
  weights_filename: class_weights
  manifest_path: ${data_dir}/manifest_filtered/train.tsv
  add_symbol:
    - "<unk>:-1"

##########################################################
#                    DATASET DEFINITION                  #
##########################################################
dataset:
  train:
    - data_src_args:
        split: train
  valid:
    - data_src_args:
        split: valid
  test:
    - name: ysed
      data_src_args: {split: test}
  preprocessor:
    _target_: espnet2.train.preprocessor.CommonPreprocessor
    fs: 16000
    text_name: label
    token_type: word
    token_list: ${data_dir}/token_list

##########################################################
#                      MODEL SETTING                     #
##########################################################
model:
  _target_: espnet3.systems.cls.model.ClsModel
  frontend:
    _target_: espnet3.systems.cls.frontend.Wav2Vec2Frontend
    encoder:
      _target_: transformers.AutoModel.from_pretrained
      pretrained_model_name_or_path: microsoft/wavlm-large
    normalize:
      _target_: espnet3.systems.cls.model.WaveformNormalize
      stats_file: ${stats_dir}/train/feats_stats.npz
  # YSED's label set (5 classes). `token_list` ends
  # with `<unk>`, not a class.
  num_classes: 5
  head_size: 1024
  head_layers: 1
  dropout: 0.5
  class_weights: ${data_dir}/class_weights

##########################################################
#                  OPTIMIZATION SETTING                  #
##########################################################
optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-5

best_model_criterion:
  - - valid/acc
    - 1
    - max

seed: 0

##########################################################
#                   DATALOADER SETTING                   #
##########################################################
dataloader:
  train:
    iter_factory:
      batches:
        type: folded
        batch_size: 8
        fold_lengths: [160000]
        sort_in_batch: descending
        sort_batch: descending
  valid:
    iter_factory:
      batches:
        fold_lengths: [160000]
        sort_in_batch: descending
        sort_batch: descending

##########################################################
#                     TRAINER SETTING                    #
##########################################################
# max_epochs = max(30, ceil(3000 / ceil(train utterances / 32))), so the optimizer
# gets at least ~3000 updates at the effective batch of 8 x 4 = 32.
trainer:
  devices: ${num_device}
  num_nodes: ${num_nodes}
  gradient_clip_val: 5.0
  max_epochs: 94
  accumulate_grad_batches: 4

  callbacks:
    - _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: valid/acc
      mode: max
      patience: 15

fit: {}
