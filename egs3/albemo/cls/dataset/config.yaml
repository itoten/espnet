builder:
  # Source layout ---------------------------------------------------------
  # `albemo/recordings/<speaker>/<emotion>/sentence_<n>.wav`, where the emotion
  # folder is a transliterated Albanian emotion word.
  source_env_var: ALBEMO
  dataset_path: download

  # Download --------------------------------------------------------------
  # Zenodo record 21638085, CC BY 4.0.
  base_url: https://zenodo.org/api/records/21638085/files
  archive_name: albemo-v1.0.zip
  remove_archive: true

  # Labels ----------------------------------------------------------------
  # Emotion folder name (ASCII transliteration of the Albanian word) to
  # manifest label, as given by `emotion_en` in the release's manifest.csv.
  emotion_map:
    neutral: neutral
    gezim: happy
    trishtim: sad
    zemerim: angry
    frike: fear
    habi: surprise
    neveri: disgust

  # Split -----------------------------------------------------------------
  # No partition is published. Utterances are split at random within each
  # label; speakers are not held out.
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # The recordings are 48 kHz mono, so `build()` resamples them to 16 kHz.
  output_env_var: ALBEMO_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
