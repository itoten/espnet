builder:
  # Source layout ---------------------------------------------------------
  # `audio/<emotion>-<intensity>-<gender>-<number>.wav`, e.g.
  # `audio/2-1-0-001.wav`: emotion code 1-5, intensity 1 (low) or 2 (high),
  # gender 0 (female) or 1 (male), speech number 001-050.
  source_env_var: KBES
  dataset_path: download
  recordings_dir: audio

  # Download --------------------------------------------------------------
  # Mendeley Data dataset vsn37ps3rx (CC BY 4.0), the authors' own upload.
  # The listing gives each file's size and SHA-256, which are checked.
  dataset_url: https://data.mendeley.com/public-api/datasets/vsn37ps3rx
  user_agent: Mozilla/5.0
  expected_files: 900
  # Files left after dropping repeated content (see `read_entries`).
  expected_entries: 880
  num_workers: 8

  # Labels ----------------------------------------------------------------
  # The emotion code in the file name to manifest label, from the dataset's
  # paper (Billah et al., Data in Brief). The intensity is not a label.
  emotion_map:
    "1": neutral
    "2": happy
    "3": sad
    "4": angry
    "5": disgust

  # Split -----------------------------------------------------------------
  # No partition is published. Utterances are split at random within each
  # label, so the splits share actors; the file names do not identify them.
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # `build()` converts the recordings to 16 kHz mono 16-bit WAV.
  output_env_var: KBES_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
