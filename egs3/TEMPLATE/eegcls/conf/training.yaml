##########################################################
#                    TRAINING SETTING                    #
##########################################################
# Quick usage:
#   python run.py --stages create_dataset prepare_labels collect_stats \
#       --training_config conf/training.yaml
#   python run.py --stages train --training_config conf/training.yaml
#
# This is the shared default merged under every EEG classification recipe's
# training config (see `load_and_merge_config` in `run.py`). Only generic
# path and system scaffolding lives here; everything task-specific is left
# null for the recipe config to fill in.
#
# Main stages and what this config is used for:
# - `create_dataset`: uses `create_dataset` and `dataset`
# - `prepare_labels`: uses `prepare_labels`
# - `collect_stats`: uses `dataset`, `dataloader`, `model`, and `parallel`
# - `train`: uses most fields in this file

##########################################################
#                  SYSTEM AND PATH SETTING               #
##########################################################
num_device: ${oc.decode:${oc.env:NUM_DEVICE,1}}
num_nodes: ${oc.decode:${oc.env:NUM_NODES,1}}

# Left empty so `model` is instantiated directly via Hydra.
task:

# Path scaffold relative to the recipe root.
recipe_dir: .
data_dir: ${recipe_dir}/data
exp_tag: ${self_name:}
exp_dir: ${recipe_dir}/exp/${exp_tag}
stats_dir: ${recipe_dir}/exp/stats

##########################################################
#                 DATASET CREATION SETTING               #
##########################################################
# Forwarded as keyword arguments to the recipe `DatasetBuilder` methods.
create_dataset:
  recipe_dir: ${recipe_dir}

##########################################################
#                    DATASET DEFINITION                  #
##########################################################
# Dataset organizer used across collect_stats/train/infer/measure.
# Fill `train`, `valid`, and optionally `test` with dataset reference entries.
#
# Each dataset entry supports:
# - `data_src`: optional dataset source reference.
#   - `<recipe>/<task>` tag, e.g. `openbmi/eegcls`
#   - dotted module path, e.g. `egs3.openbmi.eegcls.dataset`
#   - omitted: load `${recipe_dir}/dataset/__init__.py`
# - `data_src_args`: kwargs forwarded to `Dataset(...)`
# - `transform`: optional Hydra-instantiated per-sample transform applied
#   before `preprocessor`
# - `name`: mainly useful for `test`; inference uses it as the output
#   subdirectory name
#
# Datasets are expected to yield `eeg` of shape (time, channels) and `label`.
# Remember to set `text_name: label` on the preprocessor.
dataset:
  _target_: espnet3.components.data.data_organizer.DataOrganizer
  _recursive_: false
  recipe_dir: ${recipe_dir}
  train:
  valid:
  test:
  preprocessor:

##########################################################
#                  LABEL INVENTORY SETTING               #
##########################################################
# Used by the `prepare_labels` stage in
# `espnet3.systems.eegcls.system.EegClsSystem`. The stage collects labels from
# the third column of the training manifest and writes them in descending
# frequency order, which the preprocessor consumes as `token_list`.
prepare_labels:

##########################################################
#                      MODEL SETTING                     #
##########################################################
# Instantiated directly via Hydra. See
# `espnet3.systems.eegcls.model.EegClsModel`.
model:

##########################################################
#                  OPTIMIZATION SETTING                  #
##########################################################
optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-3
  weight_decay: 0.01

# ESPnet3 requires a scheduler beside the optimizer. This system's reference
# decays the rate with a cosine over all epochs. A recipe that wants a different
# scheduler replaces `_target_` and its arguments together: a merge keeps keys
# the replacement does not name, and the constructor then rejects them.
scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: ${trainer.max_epochs}
scheduler_interval: epoch  # `step` or `epoch`
scheduler_monitor:         # e.g. `valid/loss` for monitored epoch schedulers

best_model_criterion:
  - - valid/loss
    - 1
    - min

seed:
init:

parallel:
  env: local
  n_workers: 1
  # Replace a stale shard lock left by an interrupted run. Do not enable while
  # another run may still be writing to the same output directory.
  allow_overwrite_lock: false

##########################################################
#                   DATALOADER SETTING                   #
##########################################################
dataloader:
  collate_fn:
    _target_: espnet2.train.collate_fn.CommonCollateFn
    int_pad_value: -1
  train:
    total_shards: 1
    dist_world_size: 1
    iter_factory:
      _target_: espnet2.iterators.sequence_iter_factory.SequenceIterFactory
      shuffle: true
      collate_fn: ${dataloader.collate_fn}
      batches:
        type: unsorted
        shape_files:
          - ${stats_dir}/train/feats_shape
        batch_size: 16
        # Only "numel" batching reads this, but `build_batch_sampler` requires
        # the argument for every type.
        batch_bins: 4000000
  valid:
    total_shards: 1
    dist_world_size: 1
    iter_factory:
      _target_: espnet2.iterators.sequence_iter_factory.SequenceIterFactory
      shuffle: false
      collate_fn: ${dataloader.collate_fn}
      batches:
        type: ${dataloader.train.iter_factory.batches.type}
        shape_files:
          - ${stats_dir}/valid/feats_shape
        batch_size: ${dataloader.train.iter_factory.batches.batch_size}
        batch_bins: ${dataloader.train.iter_factory.batches.batch_bins}

##########################################################
#                     TRAINER SETTING                    #
##########################################################
trainer:
  accelerator: auto
  devices: ${num_device}
  num_nodes: ${num_nodes}
  accumulate_grad_batches: 1
  check_val_every_n_epoch: 1
  gradient_clip_val:
  log_every_n_steps: 10
  max_epochs: 100
  logger:
    - _target_: lightning.pytorch.loggers.TensorBoardLogger
      save_dir: ${exp_dir}/tensorboard
      name: tb_logger
  strategy: ddp

  # Any Lightning callback can be appended here; ESPnet3 instantiates the list
  # on top of its own defaults. Watch the same value as `best_model_criterion`
  # so early stopping cannot cut off the epoch that would have been saved.
  # callbacks:
  #   - _target_: lightning.pytorch.callbacks.EarlyStopping
  #     monitor: valid/loss
  #     mode: min
  #     patience: 20

fit: {}
