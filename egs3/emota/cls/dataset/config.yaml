builder:
  # Source layout ---------------------------------------------------------
  # `<source>/data/<speaker>_<sentence>_<emotion>.wav`, e.g. `01_05_ang.wav`
  # = speaker 1, sentence 5, angry (dataset card, "File naming"). The label
  # comes from the file name; `data/metadata.csv` is not read.
  source_env_var: EMOTA
  dataset_path: download
  audio_subdir: data
  file_re: "^(?P<speaker>\\d{2})_(?P<sentence>\\d{2})_(?P<emotion>[a-z]{3})\\.wav$"
  # Number of recordings in the release (dataset card; the repository file
  # listing at the pinned revision agrees). Fewer files means an incomplete
  # download.
  expected_files: 936

  # Download --------------------------------------------------------------
  # Hugging Face dataset aaivu-labs/EmoTa at a pinned commit. The dataset is
  # gated: accept the terms on its Hugging Face page while logged in (access
  # is then granted automatically) and log in on this machine
  # (`huggingface-cli login` or `HF_TOKEN`) before `prepare_source`.
  # License: EmoTa Academic-Commercial License v1.0 (academic use under
  # CC BY-NC 4.0; no redistribution of the data).
  hf_repo: aaivu-labs/EmoTa
  hf_revision: 58682568acd31be03acf07bb33de3f2528e74563
  hf_page: https://huggingface.co/datasets/aaivu-labs/EmoTa
  allow_patterns:
    - data/*.wav
    - README.md
    - LICENSE.txt

  # Labels ----------------------------------------------------------------
  # The 3-letter emotion code of the file name to manifest label (codes as
  # given by the dataset card). All five are emotions and all are kept.
  emotion_map:
    ang: angry
    hap: happy
    sad: sad
    fea: fear
    neu: neutral

  # Split -----------------------------------------------------------------
  # The release publishes no partition and the dataset card suggests none.
  # Utterances are split at random within each label; speakers are not held
  # out, so the splits share speakers (and sentences). Note from the file
  # listing: not every speaker recorded every emotion, so a speaker-held-out
  # split would leave some labels thin.
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # The recordings are 48 kHz mono 16-bit (dataset card); `build()` converts
  # them to 16 kHz mono.
  output_env_var: EMOTA_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
