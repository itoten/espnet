builder:
  # Source layout ---------------------------------------------------------
  # The archive unpacks to
  # `SantaliESC (Santali Emotional Speech Corpus)/<Emotion>/Statement <n>/03-01-01-<EE>-<SS>-<NN>.wav`:
  # five emotion folders (Angry, Happy, Neutral, Sad, Surprise), five
  # statement folders in each, and 80 files per statement folder. In the file
  # name, EE is the emotion (01 Angry ... 05 Surprise, matching the folder),
  # SS the statement and NN runs from 01 to 80 in every folder. The Zenodo
  # record does not document the naming. `build()` walks the whole tree and
  # labels each file from its path with the rules below; if a file cannot be
  # labelled, the build stops and prints a sample of the paths. Every file
  # found is listed in `<SANTALIESC_OUTPUT>/source_files.txt`, and the members
  # of a downloaded archive in `<SANTALIESC_OUTPUT>/archive_members.txt`.
  source_env_var: SANTALIESC
  dataset_path: download
  # The record states WAV. Other extensions are counted and reported, not read.
  audio_extensions: [".wav"]
  # Paths (relative to the source root, `/`-separated) matching any of these
  # are skipped: macOS resource forks that also end in `.wav`.
  ignore_path_re:
    - "(^|/)__MACOSX/"
    - "(^|/)\\._"

  # Download --------------------------------------------------------------
  # Zenodo record 20702265 (DOI 10.5281/zenodo.20702265), CC BY 4.0. One zip
  # (892,440,738 bytes); `archive_md5` is the checksum the record lists. The
  # name ends in `-001`, the part number of a Google Drive export; the record
  # holds only this one part.
  base_url: https://zenodo.org/api/records/20702265/files
  archive_name: "SantaliESC (Santali Emotional Speech Corpus)-20260615T095634Z-3-001.zip"
  archive_md5: 774b4335cfc4da2f2ed29e09cfb26847
  remove_archive: true

  # Labels ----------------------------------------------------------------
  # The record names five acted emotions: Angry, Happy, Neutral, Sad,
  # Surprise. Each key is the manifest label; the values are the spellings
  # accepted in a path. The relative path (without extension) is lowercased
  # and cut into words at every character that is not a letter or digit, and
  # also between letters and digits (`Angry01` -> `angry`, `01`). A file is
  # labelled when its words contain aliases of exactly one emotion; none or
  # more than one is an error.
  emotion_aliases:
    angry: [angry, anger, ang]
    happy: [happy, happiness, hap]
    neutral: [neutral, neu]
    sad: [sad, sadness]
    surprise: [surprise, surprised, surp, sur]
  # Overrides the word rule when set: a regex searched in the relative path,
  # whose group `emotion` must be one of the aliases above. Example for names
  # like `S12_E3_...` with numeric codes: also fill `emotion_codes`.
  emotion_re: null
  # Numeric/other codes the `emotion` group may hold, mapped to a label, e.g.
  # {"1": angry, "2": happy, ...}. Only read together with `emotion_re`.
  emotion_codes: {}

  # Speakers --------------------------------------------------------------
  # Read only to hold speakers out between splits. `speaker_re` is a regex
  # searched in the relative path with a group `speaker`; it must match every
  # file. The last field NN of the file name is taken as the speaker: it runs
  # from 01 to 80 in every emotion/statement folder, which matches the 80
  # speakers x 5 statements x 5 emotions the record states. The record does
  # not say so in words, so this is an inference from the layout. When
  # `speaker_re` is null and `infer_speaker_from_folders` is true, the
  # innermost folder that is not an emotion name is tried instead (it does
  # not identify speakers in this release: those folders are the statements).
  speaker_re: "-(?P<speaker>[0-9]{2})\\.wav$"
  infer_speaker_from_folders: false
  expected_speakers: 80

  # Release size stated on the record (80 speakers x 5 sentences x 5
  # emotions). A different count is logged as a warning, not an error.
  expected_utterances: 2000

  # Duplicates ------------------------------------------------------------
  # Recordings with byte-identical content, found while building this recipe
  # (12 pairs; ids are `santaliesc-<file name without .wav>`). Eight pairs
  # have the same label (two neighbouring NN within one folder); for those,
  # the second of each pair is listed in `duplicate_ids`. Four pairs have
  # different labels: Neutral/Statement 4 NN 09-12 are identical to
  # Sad/Statement 4 NN 77-80; both members are listed in `conflicting_ids`.
  # With `exclude_duplicates: true` / `exclude_conflicting: true` the listed
  # recordings are left out; `false` uses every recording. Kept duplicates
  # may fall into different splits, since their NN differ.
  exclude_duplicates: false
  exclude_conflicting: false
  duplicate_ids:
    - santaliesc-03-01-01-02-05-22
    - santaliesc-03-01-01-04-01-40
    - santaliesc-03-01-01-04-04-75
    - santaliesc-03-01-01-04-05-47
    - santaliesc-03-01-01-05-03-55
    - santaliesc-03-01-01-05-04-48
    - santaliesc-03-01-01-05-04-60
    - santaliesc-03-01-01-05-05-67
  conflicting_ids:
    - santaliesc-03-01-01-03-04-09
    - santaliesc-03-01-01-03-04-10
    - santaliesc-03-01-01-03-04-11
    - santaliesc-03-01-01-03-04-12
    - santaliesc-03-01-01-04-04-77
    - santaliesc-03-01-01-04-04-78
    - santaliesc-03-01-01-04-04-79
    - santaliesc-03-01-01-04-04-80

  # Split -----------------------------------------------------------------
  # No partition is published. With speakers known (see above), speakers are
  # shuffled with `split_seed` and cut by the ratios (80 -> 64/8/8), so no
  # speaker is shared between splits. Without speakers, utterances are split
  # at random within each label by the same ratios. `split_mode` forces one
  # of the two: `auto`, `speaker` (fails when speakers are unknown) or
  # `utterance`.
  split_mode: auto
  speaker_train_ratio: 0.8
  speaker_valid_ratio: 0.1
  speaker_test_ratio: 0.1
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # The release holds stereo files, 48 kHz (1,975) and 44.1 kHz (25);
  # `build()` converts every file to 16 kHz mono 16-bit PCM with ffmpeg.
  output_env_var: SANTALIESC_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000
  archive_members_file: archive_members.txt
  source_files_file: source_files.txt

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
