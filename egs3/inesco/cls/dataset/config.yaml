builder:
  # Source layout ---------------------------------------------------------
  # `audio/<speaker>_<emotion><sentence>.wav`, e.g. `audio/mdpa_a250.wav`:
  # speaker mdpa/mbaz (male) or fyat/fcim (female), emotion letter, sentence
  # number 001-600.
  source_env_var: INESCO
  dataset_path: download
  recordings_dir: audio

  # Download --------------------------------------------------------------
  # Mendeley Data dataset hzrznx3xs5 (CC BY 4.0), the authors' own upload.
  # The listing gives each file's size and SHA-256, which are checked. The files
  # are fetched as the dataset's zip ("Download all" on the dataset page).
  dataset_url: https://data.mendeley.com/public-api/datasets/hzrznx3xs5
  user_agent: Mozilla/5.0
  archive_url: https://data.mendeley.com/public-api/zip/hzrznx3xs5/download/1
  expected_files: 2399

  # Labels ----------------------------------------------------------------
  # The emotion letter in the file name, as given by the release's
  # "Guideline of File Naming INESCO Dataset.pdf" (h happiness, a anger,
  # s sadness).
  emotion_map:
    h: happy
    a: angry
    s: sad

  # Split -----------------------------------------------------------------
  # No partition is published. Each sentence is read by all 4 speakers in one
  # emotion, so sentences (not recordings) are split at random within each
  # label; the splits share the 4 speakers.
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # `build()` converts the recordings to 16 kHz mono 16-bit WAV.
  output_env_var: INESCO_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
