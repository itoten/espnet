builder:
  # Source layout ---------------------------------------------------------
  # `audio/<actor>_<gender>_<emotion>_<number>.wav`, e.g. `audio/1_0_1_01.wav`:
  # actor 1-10, gender 0 (male) or 1 (female), emotion code 1-7, then 01-50.
  source_env_var: URDUSER
  dataset_path: download
  recordings_dir: audio

  # Download --------------------------------------------------------------
  # Mendeley Data dataset jcpfjnk5c2 (CC BY 4.0), the authors' own upload.
  # The listing gives each file's size and SHA-256, which are checked. The files
  # are fetched as the dataset's zip ("Download all" on the dataset page), which
  # took 8 min 39 s here against more than 40 min for the files one by one.
  dataset_url: https://data.mendeley.com/public-api/datasets/jcpfjnk5c2
  user_agent: Mozilla/5.0
  archive_url: https://data.mendeley.com/public-api/zip/jcpfjnk5c2/download/4
  expected_files: 3500

  # Labels ----------------------------------------------------------------
  # The emotion code in the file name to manifest label. The order is that of
  # the dataset description (Angry, Fear, Boredom, Disgust, Happy, Neutral, Sad);
  # the codes were checked against the Urdu emotion words in the release's
  # `UrduSER_Description.xlsx`, which agree for all 3500 files.
  emotion_map:
    "1": angry
    "2": fear
    "3": boredom
    "4": disgust
    "5": happy
    "6": neutral
    "7": sad

  # Split -----------------------------------------------------------------
  # No partition is published. Utterances are split at random within each
  # label, so the splits share the 10 actors.
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # `build()` converts the recordings to 16 kHz mono 16-bit WAV.
  output_env_var: URDUSER_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
