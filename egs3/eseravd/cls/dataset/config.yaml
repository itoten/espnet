builder:
  # Source layout ---------------------------------------------------------
  # The Kaggle zip holds three releases. Only `E-SERAVD 1.2` is used: its
  # `.../02_Audio-Only/<NN_Emotion>/<film>/NN-NN-<film>-T-<clip>.wav` has 3,000
  # clips, 500 per emotion.
  source_env_var: ESERAVD
  dataset_path: download
  release_dir: E-SERAVD 1.2

  # Source ----------------------------------------------------------------
  # Kaggle (free account, CC BY 4.0). `prepare_source` fetches it with the
  # Kaggle CLI, which needs an API token (~/.kaggle/access_token or
  # $KAGGLE_API_TOKEN), as jlcorpus/cls does. The zip is 6.4 GB because it
  # also holds the mp4 video and two older releases; only the .wav files of
  # `release_dir` are extracted (`extract_prefix`, `extract_suffix`).
  kaggle_url: https://www.kaggle.com/datasets/ahmadnafibudianto/e-seravd-speech-emotion-recognition-av-dataset
  kaggle_dataset: ahmadnafibudianto/e-seravd-speech-emotion-recognition-av-dataset
  remove_archive: true
  extract_prefix: "E-SERAVD 1.2/"
  extract_suffix: .wav
  # Fewer files means an incomplete extraction.
  expected_files: 3000

  # Labels ----------------------------------------------------------------
  # The emotion code (second number of the file name, also the folder prefix).
  emotion_map:
    "01": angry
    "02": sad
    "03": neutral
    "04": happy
    "05": disgust
    "06": fear

  # Exclusions -----------------------------------------------------------
  # Files left out of every split (see the readme): 12 pairs of clips from the
  # film DRNT hold the same audio under two different emotion labels. Which
  # label is right cannot be decided, so both clips of each pair are dropped.
  exclude_files:
    - 02-01-DRNT-T-0097.wav
    - 02-01-DRNT-T-0098.wav
    - 02-01-DRNT-T-0099.wav
    - 02-01-DRNT-T-0101.wav
    - 02-02-DRNT-T-0035.wav
    - 02-02-DRNT-T-0054.wav
    - 02-02-DRNT-T-0055.wav
    - 02-02-DRNT-T-0064.wav
    - 02-02-DRNT-T-0066.wav
    - 02-02-DRNT-T-0091.wav
    - 02-02-DRNT-T-0097.wav
    - 02-02-DRNT-T-0106.wav
    - 02-03-DRNT-T-0016.wav
    - 02-03-DRNT-T-0049.wav
    - 02-03-DRNT-T-0052.wav
    - 02-04-DRNT-T-0082.wav
    - 02-04-DRNT-T-0085.wav
    - 02-05-DRNT-T-0049.wav
    - 02-05-DRNT-T-0058.wav
    - 02-06-DRNT-T-0021.wav
    - 02-06-DRNT-T-0053.wav
    - 02-06-DRNT-T-0054.wav
    - 02-06-DRNT-T-0059.wav
    - 02-06-DRNT-T-0062.wav

  # Split -----------------------------------------------------------------
  # No partition or speaker id is published. The clips come from 11 films, so
  # whole films are held out (3 for test, 1 for valid, 7 for training) as the
  # closest available stand-in for speaker independence.
  n_test_groups: 3
  n_valid_groups: 1
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # `build()` converts every recording to 16 kHz mono.
  output_env_var: ESERAVD_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
