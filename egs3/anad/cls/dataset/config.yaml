builder:
  # Source layout ---------------------------------------------------------
  # `1sec_segmented_part{1,2,3}/1sec_segmented_part*/<call>_<turn> (<k>).wav`
  # (1-second chunks, e.g. `V7_1 (145).wav`) plus `ANAD.csv`, whose `name` and
  # `Emotion` columns give the label.
  source_env_var: ANAD
  dataset_path: download
  audio_glob: 1sec_segmented_part*/*/*.wav
  labels_csv: ANAD.csv

  # Download --------------------------------------------------------------
  # Kaggle needs a login, so the recipe does not download. Fetch the zip by
  # hand and extract its `*.wav` and `*.csv` members (the caller_Reciever_turns
  # videos are not needed).
  request_url: https://www.kaggle.com/datasets/suso172/arabic-natural-audio-dataset
  # `ANAD.csv` lists 1,383 chunks; 49 of them have no wav file in the release.
  max_missing_audio: 60

  # Labels ----------------------------------------------------------------
  # The `Emotion` column to manifest label.
  emotion_map:
    angry: angry
    happy: happy
    surprised: surprise

  # Split -----------------------------------------------------------------
  # No partition or speaker id is published, and each call carries a single
  # label. Chunks of the same call and turn (`V7_1`) stay in one split; groups
  # are assigned per label to hit the ratios. Speakers are not held out.
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # The recordings are 44.1 kHz stereo; `build()` converts them to 16 kHz mono.
  output_env_var: ANAD_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
