##########################################################
#                    TRAINING SETTING                    #
##########################################################
# Quick usage:
#   python run.py --stages create_dataset --training_config conf/training.yaml
#   python run.py --stages collect_stats train --training_config conf/training.yaml
#
##########################################################
#                  SYSTEM AND PATH SETTING               #
##########################################################
# ESPnet3's own classification task. Its `model_choices` resolves to
# `espnet3.systems.cls.espnet_model.ClassificationModel`, which applies
# `freeze_param` itself.
task: espnet3.systems.cls.task.CLSTask

# `dataset/builder.py` writes the manifests here; the WAV files stay where the
# corpus was downloaded. Keep the two in sync by reading the same variable.
data_dir: ${oc.env:JLCORPUS_OUTPUT,./data}
exp_tag: train_cls_wavlm_transformer

##########################################################
#              LONG/SHORT FILTERING SETTING              #
##########################################################
# The test split is left unfiltered so the reported scores cover all of it.
# JL-Corpus clips run 1.2 to 3.4 s, so the bounds below drop nothing; they are kept
# to catch a corrupt or truncated resample rather than to reshape the data.
remove_long_short:
  min_wav_duration: 0.1
  max_wav_duration: 20
  splits:
    - train
    - valid
  save_path: ${data_dir}/manifest_filtered
  manifest_paths:
    train: ${data_dir}/manifest/train.tsv
    valid: ${data_dir}/manifest/valid.tsv

##########################################################
#                  LABEL INVENTORY SETTING               #
##########################################################
# Built from the filtered training manifest, so a label that only ever appears
# in a dropped utterance does not enter the class list.
prepare_labels:
  save_path: ${data_dir}
  filename: token_list
  manifest_path: ${data_dir}/manifest_filtered/train.tsv
  add_symbol:
    - "<unk>:-1"

##########################################################
#                    DATASET DEFINITION                  #
##########################################################
dataset:
  train:
    - data_src_args:
        split: train
  valid:
    - data_src_args:
        split: valid
  preprocessor:
    _target_: espnet2.train.preprocessor.CommonPreprocessor
    fs: 16000
    # Classification stores the emotion label in the `label` field.
    text_name: label
    token_type: word
    token_list: ${data_dir}/token_list

##########################################################
#                      MODEL SETTING                     #
##########################################################
model:
  token_list: ${data_dir}/token_list
  frontend: s3prl
  frontend_conf:
    frontend_conf:
      upstream: wavlm_base_plus
    multilayer_feature: true
  freeze_param:
    - frontend.upstream
  normalize: utterance_mvn
  normalize_conf: {}
  encoder: transformer
  encoder_conf:
    output_size: 128
    attention_heads: 4
    linear_units: 1024
    num_blocks: 4
    dropout_rate: 0.4
    input_layer: linear
  decoder: linear
  model_conf:
    classification_type: multi-class

##########################################################
#                  OPTIMIZATION SETTING                  #
##########################################################
optimizer:
  # `weight_decay` is 1e-6 in the TEMPLATE default; ESPnet2 leaves Adam's
  # default of 0, so it is switched off explicitly here.
  lr: 1.0e-3
  weight_decay: 0

scheduler:
  # 10 epochs, matching the ratio the MELD recipe inherits from ESPnet2.
  # Recompute after `create_dataset` if the split sizes change:
  # `wc -l < $JLCORPUS_OUTPUT/manifest_filtered/train.tsv` / batch_size * 10.
  warmup_steps: 450

best_model_criterion:
  - - valid/acc
    - 1
    - max

seed: 0

##########################################################
#                   DATALOADER SETTING                   #
##########################################################
# `fold_lengths` counts WavLM frames (50 fps), so 500 is 10 s. Every JL-Corpus clip
# is far shorter, so batches stay at `batch_size` throughout; the fold is kept so an
# unusually long file still shrinks its own batch.
dataloader:
  train:
    iter_factory:
      batches:
        type: folded
        batch_size: 32
        fold_lengths: [500]
        sort_in_batch: descending
        sort_batch: descending
  valid:
    iter_factory:
      batches:
        fold_lengths: [500]
        sort_in_batch: descending
        sort_batch: descending

##########################################################
#                     TRAINER SETTING                    #
##########################################################
trainer:
  devices: 1
  num_nodes: 1
  gradient_clip_val: 5.0
  max_epochs: 30

  # ESPnet2 stops on `valid/loss`, but this recipe selects checkpoints on
  # `valid/acc`; watching the same value keeps the best epoch from being cut off.
  callbacks:
    - _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: valid/acc
      mode: max
      patience: 5

fit: {}
