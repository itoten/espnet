builder:
  # Source layout ---------------------------------------------------------
  # `<source>/UFTBESD_Metadata.csv` plus the wav files anywhere below
  # `<source>` (the archive holds `UFTBESD/<MALE|FEMALE>/PERSON n(NAME)/SENTENCE k/`).
  source_env_var: UFTBESD
  dataset_path: download
  labels_csv: UFTBESD_Metadata.csv

  # Download --------------------------------------------------------------
  # Mendeley Data h3f8pjbw73 version 4, CC BY 4.0 (244 MB zip). Mendeley
  # rejects the default urllib user agent.
  files:
    - name: UFTBESD_Metadata.csv
      url: https://data.mendeley.com/public-files/datasets/h3f8pjbw73/files/f9f7dd3e-32b6-4949-85cf-21af2fe4f4b3/file_downloaded
      sha256: 2f9b14bc0a8ee1dbd99bbb87f22034b38af97e900a0df8bf573e17de2a97f375
    - name: UFTBESD.zip
      url: https://data.mendeley.com/public-files/datasets/h3f8pjbw73/files/dfeb1d74-8cca-4d4e-bd4b-24f12a08e187/file_downloaded
      sha256: bcf895e7947dc8fd56a1e994586f849259042aab9e83693d6470b0618bbe2c91
  archive_name: UFTBESD.zip
  # Fewer files means an interrupted extraction.
  expected_files: 1400
  remove_archive: true

  # Labels ----------------------------------------------------------------
  # `emotion_label` column of the metadata to manifest label.
  emotion_map:
    Angry: angry
    Disgust: disgust
    Fear: fear
    Happy: happy
    Neutral: neutral
    Sad: sad
    Surprise: surprise

  # Exclusions -----------------------------------------------------------
  # Files left out of every split (see the readme).
  exclude_files:
    # P_44 and P_90 repeat P_43 (sentences 1 and 2, all seven emotions): byte-identical audio; P_43 is kept.
    - P_44_F_44_SUMAIYASANVI_S_01_ANGRY.wav
    - P_44_F_44_SUMAIYASANVI_S_01_DISGUST.wav
    - P_44_F_44_SUMAIYASANVI_S_01_FEAR.wav
    - P_44_F_44_SUMAIYASANVI_S_01_HAPPY.wav
    - P_44_F_44_SUMAIYASANVI_S_01_NEUTRAL.wav
    - P_44_F_44_SUMAIYASANVI_S_01_SAD.wav
    - P_44_F_44_SUMAIYASANVI_S_01_SURPRISE.wav
    - P_44_F_44_SUMAIYASANVI_S_02_ANGRY.wav
    - P_44_F_44_SUMAIYASANVI_S_02_DISGUST.wav
    - P_44_F_44_SUMAIYASANVI_S_02_FEAR.wav
    - P_44_F_44_SUMAIYASANVI_S_02_HAPPY.wav
    - P_44_F_44_SUMAIYASANVI_S_02_NEUTRAL.wav
    - P_44_F_44_SUMAIYASANVI_S_02_SAD.wav
    - P_44_F_44_SUMAIYASANVI_S_02_SURPRISE.wav
    - P_90_M_40_SHUVO_S_01_ANGRY.wav
    - P_90_M_40_SHUVO_S_01_DISGUST.wav
    - P_90_M_40_SHUVO_S_01_FEAR.wav
    - P_90_M_40_SHUVO_S_01_HAPPY.wav
    - P_90_M_40_SHUVO_S_01_NEUTRAL.wav
    - P_90_M_40_SHUVO_S_01_SAD.wav
    - P_90_M_40_SHUVO_S_01_SURPRISE.wav
    - P_90_M_40_SHUVO_S_02_ANGRY.wav
    - P_90_M_40_SHUVO_S_02_DISGUST.wav
    - P_90_M_40_SHUVO_S_02_FEAR.wav
    - P_90_M_40_SHUVO_S_02_HAPPY.wav
    - P_90_M_40_SHUVO_S_02_NEUTRAL.wav
    - P_90_M_40_SHUVO_S_02_SAD.wav
    - P_90_M_40_SHUVO_S_02_SURPRISE.wav
    # P_62 repeats P_61 (sentence 2, all seven emotions): byte-identical audio; P_61 is kept.
    - P_62_M_12_TARIF_S_02_ANGRY.wav
    - P_62_M_12_TARIF_S_02_DISGUST.wav
    - P_62_M_12_TARIF_S_02_FEAR.wav
    - P_62_M_12_TARIF_S_02_HAPPY.wav
    - P_62_M_12_TARIF_S_02_NEUTRAL.wav
    - P_62_M_12_TARIF_S_02_SAD.wav
    - P_62_M_12_TARIF_S_02_SURPRISE.wav
    # Same speaker and sentence, one audio file under two labels; listening showed the other label is the wrong one.
    - P_02_F_02_NASSA_S_01_DISGUST.wav
    - P_05_F_05_ARMIN_S_02_DISGUST.wav
    - P_07_F_07_KONIKA_S_01_DISGUST.wav
    - P_10_F_10_JERIN_S_02_DISGUST.wav
    - P_13_F_13_TISHA_S_02_SURPRISE.wav
    - P_26_F_26_TARIN_S_01_DISGUST.wav

  # Split -----------------------------------------------------------------
  # No partition is published. Whole speakers are held out.
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # The recordings are 44.1 kHz mono; `build()` converts them to 16 kHz.
  output_env_var: UFTBESD_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
