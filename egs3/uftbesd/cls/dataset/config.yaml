builder:
  # Source layout ---------------------------------------------------------
  # `<source>/UFTBESD_Metadata.csv` plus the wav files anywhere below
  # `<source>` (the archive holds `UFTBESD/<MALE|FEMALE>/PERSON n(NAME)/SENTENCE k/`).
  source_env_var: UFTBESD
  dataset_path: download
  labels_csv: UFTBESD_Metadata.csv

  # Download --------------------------------------------------------------
  # Mendeley Data h3f8pjbw73 version 4, CC BY 4.0 (244 MB zip). Mendeley
  # rejects the default urllib user agent.
  files:
    - name: UFTBESD_Metadata.csv
      url: https://data.mendeley.com/public-files/datasets/h3f8pjbw73/files/f9f7dd3e-32b6-4949-85cf-21af2fe4f4b3/file_downloaded
      sha256: 2f9b14bc0a8ee1dbd99bbb87f22034b38af97e900a0df8bf573e17de2a97f375
    - name: UFTBESD.zip
      url: https://data.mendeley.com/public-files/datasets/h3f8pjbw73/files/dfeb1d74-8cca-4d4e-bd4b-24f12a08e187/file_downloaded
      sha256: bcf895e7947dc8fd56a1e994586f849259042aab9e83693d6470b0618bbe2c91
  archive_name: UFTBESD.zip
  # Fewer files means an interrupted extraction.
  expected_files: 1400
  remove_archive: true

  # Labels ----------------------------------------------------------------
  # `emotion_label` column of the metadata to manifest label.
  emotion_map:
    Angry: angry
    Disgust: disgust
    Fear: fear
    Happy: happy
    Neutral: neutral
    Sad: sad
    Surprise: surprise

  # Split -----------------------------------------------------------------
  # No partition is published. Speakers are held out; speakers who share a
  # byte-identical recording are kept in the same split.
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # The recordings are 44.1 kHz mono; `build()` converts them to 16 kHz.
  output_env_var: UFTBESD_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
