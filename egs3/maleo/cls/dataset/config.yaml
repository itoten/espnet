builder:
  # Source layout ---------------------------------------------------------
  # `audio/<folder>/<name>.wav` (or `.WAV`), one folder per emotion, named in
  # Indonesian. The file names are irregular, e.g. `Jijik 1.WAV`, `Takut13.WAV`.
  source_env_var: MALEO
  dataset_path: download
  recordings_dir: audio

  # Download --------------------------------------------------------------
  # The annotated copy `dikal/maleo-emotion-annotated` of `maleo-ai/maleo-emotion`
  # (CC BY 4.0), pinned to one commit. The original repository asks for a
  # Hugging Face login; this copy does not. Hugging Face lists each file's
  # size and SHA-256, which are checked per file.
  repo_id: dikal/maleo-emotion-annotated
  revision: ddbaf824d3632b3fcaf1326b7ca9ed4c2b0e0114
  expected_files: 700
  num_workers: 8

  # Labels ----------------------------------------------------------------
  # The folder name to manifest label.
  emotion_map:
    Jijik: disgust
    Marah: angry
    Netral: neutral
    Sedih: sad
    Senang: happy
    Takut: fear
    Terkejut: surprise

  # Split -----------------------------------------------------------------
  # No partition is published. Utterances are split at random within each
  # label; the release does not say who spoke which recording, so speakers cannot
  # be held out.
  train_ratio: 0.7
  valid_ratio: 0.1
  test_ratio: 0.2
  split_seed: 0

  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

  # Build outputs ---------------------------------------------------------
  # The recordings are 44.1 kHz stereo; `build()` converts them to 16 kHz mono.
  output_env_var: MALEO_OUTPUT
  data_path: data
  wav_subdir: wav
  sampling_rate: 16000

dataset:
  # Test stays unfiltered so the reported scores cover the whole split.
  split_manifest_paths:
    train: manifest_filtered/train.tsv
    valid: manifest_filtered/valid.tsv
    test: manifest/test.tsv
